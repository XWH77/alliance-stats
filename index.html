<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>同盟战功统计看板</title>
<style>
:root{
  --bg:#f4f6f9; --panel:#ffffff; --panel2:#f7f9fc;
  --line:#e6eaf1; --text:#1b2230; --dim:#6d7787;
  --accent:#3b6cf6; --accent-soft:#eef3ff;
  --good:#12a150; --bad:#e5484d;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 16px 34px -24px rgba(16,24,40,.35);
  --r:16px;
  --c1:#4f7cff; --c2:#10b3a3; --c3:#f59e0b; --c4:#8b5cf6;
  --c5:#ef4444; --c6:#0ea5c6; --c7:#84cc16; --c8:#64748b;
}
html[data-theme="dark"]{
  --bg:#0e1117; --panel:#161b23; --panel2:#1b212b;
  --line:#262d3a; --text:#e9edf4; --dim:#98a2b3;
  --accent:#7aa2ff; --accent-soft:#1b2740;
  --good:#4ade80; --bad:#f87171;
  --shadow:0 1px 0 rgba(255,255,255,.03),0 20px 44px -32px #000;
  --c1:#6d95ff; --c2:#2dd4bf; --c3:#fbbf24; --c4:#a78bfa;
  --c5:#f87171; --c6:#22d3ee; --c7:#a3e635; --c8:#94a3b8;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1100px 520px at 100% -12%, rgba(59,108,246,.10), transparent 62%),
    radial-gradient(900px 460px at -12% 108%, rgba(245,158,11,.08), transparent 58%),
    var(--bg);
  background-attachment:fixed;
  color:var(--text);
  font:15px/1.55 -apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  overflow-x:hidden;
}
html[data-theme="dark"] body{
  background:
    radial-gradient(1100px 520px at 100% -12%, rgba(122,162,255,.10), transparent 62%),
    radial-gradient(900px 460px at -12% 108%, rgba(245,158,11,.05), transparent 58%),
    var(--bg);
}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
a{color:var(--accent)}
.aurora{display:none}

/* header */
.top{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 16px;
  background:color-mix(in srgb, var(--panel) 84%, transparent);
  backdrop-filter:blur(14px) saturate(1.3);
  border-bottom:1px solid var(--line);
  padding-top:calc(12px + env(safe-area-inset-top));
}
@supports not (background:color-mix(in srgb,#fff 50%,transparent)){
  .top{background:var(--panel)}
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.seal{
  width:40px;height:40px;flex:0 0 40px;border-radius:12px;
  display:grid;place-items:center;
  background:linear-gradient(145deg,var(--accent),#6a8dff);
  color:#fff;font-size:19px;font-weight:700;
  box-shadow:0 6px 16px -6px rgba(59,108,246,.7);
}
.brand h1{font-size:17px;letter-spacing:.3px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:11px;color:var(--dim);letter-spacing:1.2px;margin-top:1px}
.topRight{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.dateSel{
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  padding:7px 10px;font-size:12.5px;color:var(--text);outline:none;max-width:126px;
}
.badge{font-size:11px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.badge.demo{color:var(--accent);border-color:rgba(59,108,246,.35);background:var(--accent-soft)}
.iconBtn{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  background:var(--panel2);border:1px solid var(--line);
  color:var(--dim);cursor:pointer;font-size:15px;line-height:1;padding:0;
  transition:color .2s,border-color .2s,transform .3s;
}
.iconBtn:hover{color:var(--accent);border-color:rgba(59,108,246,.45);transform:rotate(180deg)}

/* nav */
.tabs{display:flex;gap:4px;padding:10px 16px 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  flex:0 0 auto;background:transparent;border:none;border-radius:9px;
  padding:7px 13px;font-size:13.5px;color:var(--dim);cursor:pointer;
  transition:color .2s,background .2s;
}
.tabs button:hover{color:var(--text);background:var(--panel2)}
.tabs button.on{
  color:#fff;font-weight:600;background:var(--accent);
  box-shadow:0 6px 16px -8px rgba(59,108,246,.9);
}

/* layout */
main{padding:14px 16px 40px;max-width:1080px;margin:0 auto}
.page{display:none}
.page.on{display:block;animation:fade .3s ease both}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.rowIn{animation:rise .35s both}

.panel{
  background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin-bottom:14px;
  box-shadow:var(--shadow);
  animation:rise .45s cubic-bezier(.2,.8,.2,1) both;
}
.panel h2{font-size:14px;font-weight:650;letter-spacing:.2px;color:var(--text);margin-bottom:12px}
.panelHead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.panelHead h2{margin:0}
.panelHead h2::before{
  content:"";display:inline-block;width:3px;height:12px;border-radius:2px;
  background:var(--accent);margin-right:8px;vertical-align:-1px;
}
.hint{font-size:12px;color:var(--dim);line-height:1.7}

/* cards */
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.card{
  position:relative;overflow:hidden;
  background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r);padding:14px;
  box-shadow:var(--shadow);
  animation:rise .5s cubic-bezier(.2,.8,.2,1) both;
  transition:transform .22s,box-shadow .22s;
}
.cards .card:nth-child(2){animation-delay:.04s}
.cards .card:nth-child(3){animation-delay:.08s}
.cards .card:nth-child(4){animation-delay:.12s}
.card:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(16,24,40,.05),0 22px 40px -26px rgba(16,24,40,.45)}
.card::before{
  content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;
  background:var(--accent);opacity:.85;
}
.cards .card:nth-child(2)::before{background:var(--c2)}
.cards .card:nth-child(3)::before{background:var(--c3)}
.cards .card:nth-child(4)::before{background:var(--c4)}
.card .lbl{font-size:12px;color:var(--dim);letter-spacing:.3px}
.card .val{
  font-size:27px;font-weight:700;margin-top:4px;color:var(--text);
  font-variant-numeric:tabular-nums;letter-spacing:-.6px;
}
.card .cap{font-size:11.5px;color:var(--dim);margin-top:4px}
.card .cap.up{color:var(--good)}
.card .cap.down{color:var(--bad)}

.two{display:grid;grid-template-columns:1fr;gap:0}

/* chart */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-size:11px;fill:var(--dim)}
.chart .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:3 5}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round;
  stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s .12s cubic-bezier(.4,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.chart .dot{fill:var(--panel);stroke:var(--accent);stroke-width:2}

/* bars */
.bars{display:flex;flex-direction:column;gap:12px;max-width:680px}
.barRow{display:grid;grid-template-columns:112px 1fr 64px;align-items:center;gap:10px}
.barRow .nm{font-size:12.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barTrack{height:9px;border-radius:999px;background:var(--panel2);overflow:hidden}
.barFill{
  height:100%;border-radius:999px;background:var(--accent);
  animation:grow .75s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes grow{from{width:0}}
.c1{background:var(--c1)}.c2{background:var(--c2)}.c3{background:var(--c3)}.c4{background:var(--c4)}
.c5{background:var(--c5)}.c6{background:var(--c6)}.c7{background:var(--c7)}.c8{background:var(--c8)}
.barRow .vv{text-align:right;font-size:12.5px;color:var(--text);font-variant-numeric:tabular-nums}

/* top5 */
.top5{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.top5 li{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:11px;
  background:var(--panel2);border:1px solid transparent;
  animation:rise .4s both;transition:background .2s;
}
.top5 li:hover{background:var(--accent-soft)}
.top5 li:nth-child(1){background:var(--accent-soft);border-color:rgba(59,108,246,.25)}
.top5 li:nth-child(2){animation-delay:.03s}
.top5 li:nth-child(3){animation-delay:.06s}
.top5 li:nth-child(4){animation-delay:.09s}
.top5 li:nth-child(5){animation-delay:.12s}
.rk{
  width:24px;height:24px;flex:0 0 24px;border-radius:8px;display:grid;place-items:center;
  font-size:12px;font-weight:700;background:#eef1f6;color:#5a6678;
}
html[data-theme="dark"] .rk{background:#222a36;color:#a8b3c4}
.top5 li:nth-child(1) .rk{background:var(--accent);color:#fff}
.top5 li:nth-child(2) .rk{background:#c9ced8;color:#fff}
.top5 li:nth-child(3) .rk{background:#e2b07a;color:#fff}
.top5 .nm{flex:1;font-size:13.5px;color:var(--text)}
.top5 .nm small{color:var(--dim);font-size:11px;margin-left:6px}
.top5 .vv{font-size:13.5px;color:var(--text);font-variant-numeric:tabular-nums;font-weight:600}

/* table */
.tableWrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{color:var(--dim);font-weight:500;text-align:right;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px}
th:first-child,td:first-child{text-align:left}
td{padding:10px 8px;border-bottom:1px solid var(--panel2);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tbody tr{transition:background .15s}
tbody tr:hover{background:var(--panel2)}
th.l,td.l{text-align:left}
.muted{color:var(--dim)}
.tag{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
.tag.on{color:var(--good);border-color:rgba(18,161,80,.3);background:rgba(18,161,80,.08)}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{background:transparent;border:none;border-radius:8px;padding:6px 14px;font-size:13px;color:var(--dim);cursor:pointer;transition:.18s}
.seg button:hover:not(:disabled){color:var(--text)}
.seg button.on{background:var(--panel);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(16,24,40,.12)}
html[data-theme="dark"] .seg button.on{background:#232b38;color:#fff}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.search{
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:8px 13px;font-size:13px;outline:none;min-width:150px;
  transition:border-color .2s,box-shadow .2s;
}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search::placeholder{color:var(--dim)}

/* buttons */
.btn{
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:9px 14px;font-size:13px;color:var(--text);cursor:pointer;transition:.18s;
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{filter:brightness(1.05);color:#fff}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}

/* empty */
.empty{padding:34px 16px;text-align:center}
.empty p{font-size:15px;margin-bottom:6px}
.empty .hint{margin-bottom:16px}

/* footer */
.foot{text-align:center;font-size:11px;color:var(--dim);padding:8px 0 30px}

/* mobile */
@media (max-width:640px){
  main{padding:12px 12px 92px}
  .card .val{font-size:22px}
  .tabs{
    position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:var(--panel);
    background:color-mix(in srgb, var(--panel) 92%, transparent);
    backdrop-filter:blur(16px);
    border-top:1px solid var(--line);
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    justify-content:space-around;gap:2px;overflow:visible;
  }
  .tabs button{flex:1;padding:8px 4px;font-size:12.5px;border-radius:10px;background:transparent}
  .tabs button.on{background:transparent;color:var(--accent);box-shadow:none;font-weight:700}
  .tabs button.on::before{content:"";display:block;width:18px;height:2px;border-radius:2px;background:var(--accent);margin:0 auto 5px}
  .top{padding-left:12px;padding-right:12px}
  .brand h1{font-size:15px}
  .sub{display:none}
  .dateSel{max-width:112px;font-size:12px;padding:6px 8px}
  .badge{display:none}
  .iconBtn{width:30px;height:30px;font-size:13px}
  .barRow{grid-template-columns:98px 1fr 56px;gap:8px}
  .barRow .nm{font-size:12px}
  table{font-size:13px}
  th,td{padding-left:6px;padding-right:6px}
}
@media (min-width:641px){
  .cards{grid-template-columns:repeat(4,1fr)}
  .two{grid-template-columns:1.15fr 1fr;gap:14px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
/* modal */
.modal{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(12,16,24,.55);backdrop-filter:blur(6px);animation:fade .2s both}
.modal[hidden]{display:none}
.modalCard{width:100%;max-width:520px;max-height:86vh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 30px 70px -24px rgba(9,14,26,.6);animation:rise .26s cubic-bezier(.2,.8,.2,1) both;overflow:hidden}
.modalHead{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--line)}
.modalHead h3{font-size:15px;font-weight:650}
.modalBody{padding:16px;overflow:auto}
.posterImg{width:100%;display:block;border-radius:12px;border:1px solid var(--line)}
.mHead{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.mName{font-size:20px;font-weight:700}
.mGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mGrid>div{background:var(--panel2);border-radius:11px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.mGrid b{font-size:17px;font-variant-numeric:tabular-nums}
.wList{display:flex;flex-direction:column;gap:10px}
.wItem{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;background:var(--panel2)}
.wItem .wL{flex:1;font-size:13px;color:var(--dim)}
.wItem .wN{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.wItem .wN.bad{color:var(--bad)}
.linkBtn{background:none;border:none;color:var(--accent);font-size:12px;cursor:pointer;padding:4px 2px;white-space:nowrap}
.linkBtn:hover{text-decoration:underline}
#rankBody tr,.top5 li{cursor:pointer}
</style>

<script src="data.js?v=20261127b"></script>
<script>
/* ================= 工具 ================= */
const $ = (s, r = document) => r.querySelector(s);
const fmt = n => Number(n || 0).toLocaleString('zh-CN');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WEEK = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];

/* ================= 数据层 ================= */
const KEY = 'alliance_stats_v2';
let db = { records: [], imports: [], snapshot: false };
let view = { page: 'dash', date: null, mode: 'week', q: '' };
let S = null;                       // 派生缓存

const snapKey = () => {
  const s = window.SNAPSHOT;
  if (!s) return '';
  if (Array.isArray(s.days)) return s.days.map(d => `${d.date}:${d.time || ''}:${d.rows.length}`).join('|');
  return `${s.date}:${s.time || ''}:${(s.rows || []).length}`;
};

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const o = JSON.parse(raw);
      if (o && Array.isArray(o.records) && o.records.length) {
        db = { records: o.records, imports: o.imports || [], snapshot: !!o.snapshot, key: o.key || '' };
        if (db.snapshot && db.key !== snapKey()) { seedFromSnapshot(); return; }
        return;
      }
    }
  } catch (e) { /* 忽略损坏数据 */ }
  seedFromSnapshot();
}

/* 内置快照（data.js） */
function seedFromSnapshot() {
  const snap = window.SNAPSHOT;
  const days = snap && (Array.isArray(snap.days) ? snap.days : (Array.isArray(snap.rows) ? [{ date: snap.date, time: snap.time, rows: snap.rows }] : []));
  if (!days || !days.length) { persist(); return; }
  const records = [];
  for (const day of days) {
    for (const [n, c, w, a, st, p] of day.rows) records.push({ d: day.date, n, c, w, a, st, p });
  }
  db = { records, imports: [], snapshot: true, key: snapKey() };
  persist();
}

function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { toast('保存失败：浏览器存储不可用'); }
}

function dates() { return [...new Set(db.records.map(r => r.d))].sort(); }
function rosterOf(d) {
  const m = new Map();
  for (const r of db.records) if (r.d === d) m.set(r.n, r);
  return m;
}
function data() {
  if (!S) {
    const ds = dates();
    S = { ds, maps: new Map(ds.map(d => [d, rosterOf(d)])) };
  }
  return S;
}
function latestRec(name, date) {
  const { ds, maps } = data();
  for (let i = ds.indexOf(date); i >= 0; i--) {
    const r = maps.get(ds[i]).get(name);
    if (r) return r;
  }
  return null;
}

/* 当日增量：本周累计差值；若累计变小视为新一周，取当周值 */
function snapshot(date) {
  const { ds, maps } = data();
  const i = ds.indexOf(date);
  const out = new Map();
  if (i < 0) return { date, members: out, prev: null };
  const prev = i > 0 ? ds[i-1] : null;
  for (const [name, r] of maps.get(date)) {
    const p = prev ? latestRec(name, prev) : null;
    const inc  = p ? (r.w < p.w ? r.w : r.w - p.w) : 0;
    const ainc = p ? (r.a < p.a ? r.a : r.a - p.a) : 0;
    out.set(name, { name, clan: r.c, w: r.w, a: r.a, st: r.st, p: r.p, inc, ainc, base: !!p });
  }
  return { date, members: out, prev };
}

function totalsAll() {
  const { ds, maps } = data();
  const res = new Map();
  let prev = new Map();
  for (const d of ds) {
    const cur = maps.get(d);
    for (const [name, r] of cur) {
      const p = prev.get(name);
      const inc  = p ? (r.w < p.w ? r.w : r.w - p.w) : 0;
      const ainc = p ? (r.a < p.a ? r.a : r.a - p.a) : 0;
      const t = res.get(name) || { name, clan: r.c, k: 0, a: 0 };
      t.k += inc; t.a += ainc; t.clan = r.c;
      res.set(name, t);
    }
    prev = cur;
  }
  return res;
}

/* ================= 渲染：框架 ================= */
function setPage(p) {
  view.page = p;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.page === p));
  document.querySelectorAll('.page').forEach(el => el.classList.toggle('on', el.id === 'page-' + p));
  renderPage();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function renderAll() {
  const ds = dates();
  if (!view.date || !ds.includes(view.date)) view.date = ds.length ? ds[ds.length-1] : null;
  const sel = $('#dateSel');
  if (ds.length) {
    sel.style.display = '';
    sel.innerHTML = ds.slice().reverse().map(d => `<option value="${d}">${d}</option>`).join('');
    sel.value = view.date;
  } else {
    sel.style.display = 'none';
  }
  const badge = $('#dataBadge');
  badge.style.display = ds.length ? '' : 'none';
  badge.textContent = db.snapshot ? `快照 ${ds[ds.length-1]}` : '本地数据';
  badge.classList.toggle('demo', db.snapshot);
  const s = window.SNAPSHOT || {};
  let info = '数据尚未发布';
  if (ds.length) {
    if (Array.isArray(s.days) && s.days.length > 1) {
      const f = s.days[0], l = s.days[s.days.length - 1];
      info = `数据快照 ${f.date} ${f.time || ''} → ${l.date} ${l.time || ''}`;
    } else {
      info = `数据快照 ${ds[ds.length-1]}${s.time ? ' ' + s.time : ''}`;
    }
    info += ' · 仅供同盟内部查看';
  }
  const fi = $('#footInfo');
  if (fi) fi.textContent = info;
  renderPage();
}
function renderPage() {
  if (view.page === 'dash') renderDash();
  else if (view.page === 'rank') renderRank();
  else renderClan();
}

/* ================= 渲染：仪表盘 ================= */
function renderDash() {
  const el = $('#page-dash');
  const ds = dates();
  if (!ds.length) { el.innerHTML = emptyPanel(); return; }
  const snap = snapshot(view.date);
  const hasBase = !!snap.prev;
  const list = [...snap.members.values()];
  let k = 0, a = 0, active = 0;
  const clans = new Set(), byClan = new Map();
  for (const m of list) {
    const v = hasBase ? m.inc : m.w, va = hasBase ? m.ainc : m.a;
    k += v; a += va;
    if (m.inc > 0) active++;
    clans.add(m.clan);
    const c = byClan.get(m.clan) || { name: m.clan, k: 0, a: 0, n: 0 };
    c.k += v; c.a += va; c.n++; byClan.set(m.clan, c);
  }
  const bars = [...byClan.values()].sort((x, y) => y.k - x.k);
  const maxBar = Math.max(...bars.map(b => b.k), 1);
  const top = list.slice().sort((x, y) => (hasBase ? y.inc - x.inc : y.w - x.w)).slice(0, 5);
  const last7 = ds.slice(-7).filter(d => snapshot(d).prev);
  const trend = last7.map(d => [...snapshot(d).members.values()].reduce((s, m) => s + m.inc, 0));

  let cards, chartPanel, changePanel;
  if (hasBase) {
    let pk = 0;
    for (const m of snapshot(snap.prev).members.values()) pk += m.inc;
    const delta = k - pk;
    cards = `
      <div class="card"><div class="lbl">今日战功</div><div class="val" data-v="${k}">${fmt(k)}</div>
        <div class="cap ${delta >= 0 ? 'up' : 'down'}">较昨日 ${delta >= 0 ? '+' : ''}${fmt(delta)}</div></div>
      <div class="card"><div class="lbl">今日助攻</div><div class="val" data-v="${a}">${fmt(a)}</div>
        <div class="cap">${snap.members.size} 名成员</div></div>
      <div class="card"><div class="lbl">活跃成员</div><div class="val" data-v="${active}">${active}</div>
        <div class="cap">有战功增量</div></div>
      <div class="card"><div class="lbl">门阀总数</div><div class="val" data-v="${clans.size}">${clans.size}</div>
        <div class="cap">${view.date} ${WEEK[new Date(view.date + 'T00:00:00').getDay()]}</div></div>`;
    chartPanel = trend.length >= 2
      ? `<div class="panel"><div class="panelHead"><h2>近 7 日战功趋势</h2><span class="hint">当日增量</span></div>${lineChart(trend, last7)}</div>`
      : `<div class="panel"><div class="panelHead"><h2>近 7 日战功趋势</h2><span class="hint">当日增量</span></div><p class="hint">目前只有一天的增量，明天再更新一次就能画出趋势。</p></div>`;
    const before = new Set(snapshot(snap.prev).members.keys()), now = new Set(snap.members.keys());
    const joined = [...now].filter(n => !before.has(n)), left = [...before].filter(n => !now.has(n));
    changePanel = `<div class="panel"><div class="panelHead"><h2>人员变动</h2><span class="hint">对比 ${snap.prev}</span></div>
      <div class="row" style="gap:22px;align-items:flex-start">
        <div><p class="hint" style="margin-bottom:6px">新进 ${joined.length}</p>
          <div class="row" style="gap:6px">${joined.map(n => `<span class="tag on">${esc(n)}</span>`).join('') || '<span class="muted" style="font-size:12px">无</span>'}</div></div>
        <div><p class="hint" style="margin-bottom:6px">离开 ${left.length}</p>
          <div class="row" style="gap:6px">${left.map(n => `<span class="tag">${esc(n)}</span>`).join('') || '<span class="muted" style="font-size:12px">无</span>'}</div></div>
      </div></div>`;
  } else {
    cards = `
      <div class="card"><div class="lbl">本周战功</div><div class="val" data-v="${k}">${fmt(k)}</div>
        <div class="cap">无昨日基线 · 本周累计</div></div>
      <div class="card"><div class="lbl">本周助攻</div><div class="val" data-v="${a}">${fmt(a)}</div>
        <div class="cap">${snap.members.size} 名成员</div></div>
      <div class="card"><div class="lbl">成员</div><div class="val" data-v="${snap.members.size}">${snap.members.size}</div>
        <div class="cap">${clans.size} 个门阀</div></div>
      <div class="card"><div class="lbl">人均战功</div><div class="val" data-v="${Math.round(k / Math.max(snap.members.size, 1))}">${fmt(Math.round(k / Math.max(snap.members.size, 1)))}</div>
        <div class="cap">${view.date}</div></div>`;
    const top10 = list.slice().sort((x, y) => y.w - x.w).slice(0, 10);
    const mx = Math.max(...top10.map(m => m.w), 1);
    chartPanel = `<div class="panel"><div class="panelHead"><h2>战功 TOP 10</h2><span class="hint">本周累计</span></div>
      <div class="bars">${top10.map((m, i) => `
        <div class="barRow"><div class="nm" title="${esc(m.name)}">${i + 1}. ${esc(m.name)}</div>
          <div class="barTrack"><div class="barFill c${(i % 8) + 1}" style="width:${Math.max(2, m.w / mx * 100)}%"></div></div>
          <div class="vv">${fmt(m.w)}</div></div>`).join('')}</div></div>`;
    changePanel = `<div class="panel"><div class="panelHead"><h2>人员变动</h2><span class="hint">暂无对比</span></div>
      <p class="hint">这是第一份快照。明天再导入一份，就能看到当日增量、新进和离开。</p></div>`;
  }

  const w = watchData();
  const watchPanel = `<div class="panel"><div class="panelHead"><h2>待关注</h2><span class="hint">本周战功</span></div>
    <div class="wList">
      <div class="wItem"><span class="wL">零战功</span><span class="wN ${w.zero.length ? 'bad' : ''}">${w.zero.length}</span>
        <button class="linkBtn" data-act="watch" data-kind="zero">查看全部</button></div>
      <div class="wItem"><span class="wL">低于门阀人均一半</span><span class="wN">${w.half.length}</span>
        <button class="linkBtn" data-act="watch" data-kind="half">查看全部</button></div>
    </div>
    <p class="hint" style="margin-top:10px">${snap.prev ? '' : '只有一份快照，暂时只能看本周累计；连续未增长要等明天数据。'}</p>
  </div>`;
  el.innerHTML = `<div class="cards">${cards}</div>
    <div class="row" style="justify-content:flex-end;margin:-2px 0 12px">
      <button class="btn" data-act="poster">生成战报长图</button>
    </div>${chartPanel}
    <div class="two">
      <div class="panel"><div class="panelHead"><h2>门阀战功分布</h2><span class="hint">${view.date}</span></div>
        <div class="bars">${bars.map((b, i) => `
          <div class="barRow"><div class="nm" title="${esc(b.name)}">${esc(b.name)}</div>
            <div class="barTrack"><div class="barFill c${(i % 8) + 1}" style="width:${Math.max(2, b.k / maxBar * 100)}%"></div></div>
            <div class="vv">${fmt(b.k)}</div></div>`).join('') || '<p class="hint">暂无门阀数据</p>'}
        </div>
      </div>
      <div class="panel"><div class="panelHead"><h2>${hasBase ? '今日' : '本周'} TOP 5</h2><span class="hint">${hasBase ? '战功增量' : '累计战功'}</span></div>
        <ol class="top5">${top.map((m, i) => `
          <li data-member="${esc(m.name)}"><span class="rk">${i + 1}</span>
            <span class="nm">${esc(m.name)}<small>${esc(m.clan)}</small></span>
            <span class="vv">${hasBase ? '+' : ''}${fmt(hasBase ? m.inc : m.w)}</span></li>`).join('') || '<p class="hint">暂无数据</p>'}
        </ol>
      </div>
    </div>${changePanel}${watchPanel}`;
  el.querySelectorAll('.val[data-v]').forEach(n => countUp(n, Number(n.dataset.v)));
}

/* ================= 渲染：排行 ================= */
function rankRows() {
  const snap = snapshot(view.date);
  const tot = view.mode === 'total' ? totalsAll() : null;
  const rows = [];
  for (const m of snap.members.values()) {
    let k = m.inc, a = m.ainc;
    if (view.mode === 'week') { k = m.w; a = m.a; }
    if (view.mode === 'total') { const t = tot.get(m.name) || { k: 0, a: 0 }; k = t.k; a = t.a; }
    rows.push({ name: m.name, clan: m.clan, k, a, st: m.st, p: m.p, active: m.inc > 0 });
  }
  return rows.sort((x, y) => y.k - x.k || y.a - x.a);
}
function renderRank() {
  const el = $('#page-rank');
  if (!dates().length) { el.innerHTML = emptyPanel(); return; }
  const hasBase = !!snapshot(view.date).prev;
  const canTotal = dates().length > 1;
  if (!hasBase && view.mode === 'today') view.mode = 'week';
  if (!canTotal && view.mode === 'total') view.mode = 'week';
  const rows = rankRows();
  const label = view.mode === 'today' ? '今日战功' : view.mode === 'week' ? '本周战功' : '累计战功';
  el.innerHTML = `
    <div class="toolbar">
      <div class="seg" id="rankMode">
        <button data-mode="today" class="${view.mode === 'today' ? 'on' : ''}" ${hasBase ? '' : 'disabled'}>今日</button>
        <button data-mode="week" class="${view.mode === 'week' ? 'on' : ''}">本周</button>
        <button data-mode="total" class="${view.mode === 'total' ? 'on' : ''}" ${canTotal ? '' : 'disabled'}>累计</button>
      </div>
      <input class="search" id="q" placeholder="搜索成员 / 门阀 / 州" value="${esc(view.q)}">
    </div>
    <div class="panel tableWrap">
      <table>
        <thead><tr><th style="width:34px">#</th><th class="l">成员</th><th>${label}</th>
          <th>助攻</th><th>势力</th></tr></thead>
        <tbody id="rankBody">${rows.length ? rows.map((r, i) => {
          const show = !view.q || (r.name + r.clan + (r.st || '')).toLowerCase().includes(view.q.toLowerCase());
          return `<tr class="${i < 15 ? 'rowIn' : ''}" style="${i < 15 ? `animation-delay:${i * 14}ms` : ''}" data-member="${esc(r.name)}" data-name="${esc(r.name + ' ' + r.clan + ' ' + (r.st || ''))}" ${show ? '' : 'hidden'}>
            <td class="muted">${i + 1}</td>
            <td class="l"><div>${esc(r.name)}${r.active && hasBase && view.mode === 'today' ? ' <span class="tag on">活跃</span>' : ''}</div>
              <div class="muted" style="font-size:11.5px">${esc(r.clan)}${r.st ? ' · ' + esc(r.st) : ''}</div></td>
            <td>${fmt(r.k)}</td><td class="muted">${fmt(r.a)}</td>
            <td class="muted">${r.p ? fmt(r.p) : '—'}</td>
          </tr>`;
        }).join('') : '<tr><td colspan="5" class="muted" style="text-align:center;padding:22px">暂无数据</td></tr>'}
        </tbody>
      </table>
    </div>
    <p class="hint">${view.mode === 'week' ? '本周战功为游戏内本周累计值。' : view.mode === 'total' ? '累计 = 每日增量之和；第一次出现时没有基线，按 0 计。' : '今日战功 = 今日累计 − 昨日本周累计；累计回落视为新一周。'}</p>`;
}
function emptyPanel() {
  return `<div class="panel empty"><p>暂时没有数据</p>
    <p class="hint">数据还没发布，稍后再打开看看。</p></div>`;
}

/* ================= 渲染：门阀 ================= */
function renderClan() {
  const el = $('#page-clan');
  if (!dates().length) { el.innerHTML = emptyPanel(); return; }
  const snap = snapshot(view.date);
  const hasBase = !!snap.prev;
  const map = new Map();
  for (const m of snap.members.values()) {
    const v = hasBase ? m.inc : m.w, va = hasBase ? m.ainc : m.a;
    const c = map.get(m.clan) || { name: m.clan, n: 0, k: 0, a: 0, active: 0 };
    c.n++; c.k += v; c.a += va; if (m.inc > 0) c.active++;
    map.set(m.clan, c);
  }
  const rows = [...map.values()].sort((x, y) => y.k - x.k);
  const total = rows.reduce((s, r) => s + r.k, 0) || 1;
  const maxK = Math.max(...rows.map(r => r.k), 1);
  const label = hasBase ? '今日战功' : '本周战功';
  el.innerHTML = `
    <div class="panel">
      <div class="panelHead"><h2>门阀战功排行</h2><span class="hint">${view.date}</span></div>
      <div class="bars">${rows.map((r, i) => `
        <div class="barRow"><div class="nm" title="${esc(r.name)}">${esc(r.name)}</div>
          <div class="barTrack"><div class="barFill c${(i % 8) + 1}" style="width:${Math.max(2, r.k / maxK * 100)}%"></div></div>
          <div class="vv">${fmt(r.k)}</div></div>`).join('')}
      </div>
    </div>
    <div class="panel tableWrap">
      <table>
        <thead><tr><th class="l">门阀</th><th>人数</th><th>${label}</th><th>助攻</th><th>人均</th><th>占比</th></tr></thead>
        <tbody>${rows.map(r => `<tr>
          <td class="l">${esc(r.name)}</td><td>${r.n}</td><td>${fmt(r.k)}</td>
          <td class="muted">${fmt(r.a)}</td><td class="muted">${fmt(Math.round(r.k / r.n))}</td>
          <td class="muted">${(r.k / total * 100).toFixed(1)}%</td></tr>`).join('')}
        </tbody>
      </table>
    </div>`;
}

/* ================= 图表 ================= */
function lineChart(points, labels) {
  if (!points.length) return '<p class="hint">暂无数据</p>';
  const W = 600, H = 190, L = 48, R = 14, T = 16, B = 28;
  const maxV = Math.max(...points, 1) * 1.15;
  const X = i => L + (W - L - R) * (i / Math.max(points.length - 1, 1));
  const Y = v => H - B - (v / maxV) * (H - T - B);
  const pts = points.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`);
  const area = `M${X(0).toFixed(1)},${H - B} L` + pts.join(' L') + ` L${X(points.length - 1).toFixed(1)},${H - B} Z`;
  const grid = [0, 0.5, 1].map(r => {
    const y = (H - B - r * (H - T - B)).toFixed(1);
    const val = Math.round(maxV * r);
    return `<line class="grid" x1="${L}" y1="${y}" x2="${W - R}" y2="${y}"></line>
      <text x="${L - 8}" y="${Number(y) + 4}" text-anchor="end">${val >= 10000 ? (val / 10000).toFixed(1) + '万' : fmt(val)}</text>`;
  }).join('');
  const xlabels = labels.map((t, i) => i % 2 === 0 || i === labels.length - 1
    ? `<text x="${X(i).toFixed(1)}" y="${H - 8}" text-anchor="middle">${t.slice(5)}</text>` : '').join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="战功趋势">
    <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--accent)" stop-opacity=".28"/>
      <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}
    <path d="${area}" fill="url(#g1)"></path>
    <polyline class="line" pathLength="1" points="${pts.join(' ')}"></polyline>
    ${points.map((v, i) => `<circle class="dot" cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="2.6"></circle>`).join('')}
    ${xlabels}
  </svg>`;
}

/* ================= 交互 ================= */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-page]');
  if (b) { setPage(b.dataset.page); return; }
  const m = e.target.closest('#rankMode button');
  if (m && !m.disabled) { view.mode = m.dataset.mode; renderRank(); }
});

document.addEventListener('input', e => {
  if (e.target.id === 'q') {
    view.q = e.target.value;
    const q = view.q.toLowerCase();
    document.querySelectorAll('#rankBody tr[data-name]').forEach(tr => {
      tr.hidden = q && !tr.dataset.name.toLowerCase().includes(q);
    });
  }
});

$('#dateSel').addEventListener('change', e => { view.date = e.target.value; renderAll(); });

/* ================= 弹层 ================= */
function openModal(title, html) {
  $('#mTitle').textContent = title;
  $('#mBody').innerHTML = html;
  $('#modal').hidden = false;
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  $('#modal').hidden = true;
  $('#mBody').innerHTML = '';
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ================= 成员详情 ================= */
function showMember(name) {
  const snap = snapshot(view.date);
  const m = snap.members.get(name);
  if (!m) return;
  const list = [...snap.members.values()];
  const rankAll = list.slice().sort((a, b) => b.w - a.w).findIndex(x => x.name === name) + 1;
  const clanList = list.filter(x => x.clan === m.clan).sort((a, b) => b.w - a.w);
  const rankClan = clanList.findIndex(x => x.name === name) + 1;
  const clanK = clanList.reduce((s, x) => s + x.w, 0) || 1;
  openModal('成员详情', `
    <div class="mHead">
      <div class="mName">${esc(m.name)}</div>
      <div class="hint">${esc(m.clan)}${m.st ? ' · ' + esc(m.st) : ''}</div>
    </div>
    <div class="mGrid">
      <div><span class="hint">本周战功</span><b>${fmt(m.w)}</b></div>
      <div><span class="hint">本周助攻</span><b>${fmt(m.a)}</b></div>
      <div><span class="hint">盟内排名</span><b>${rankAll} / ${list.length}</b></div>
      <div><span class="hint">门阀内排名</span><b>${rankClan} / ${clanList.length}</b></div>
      <div><span class="hint">势力值</span><b>${m.p ? fmt(m.p) : '—'}</b></div>
      <div><span class="hint">占门阀战功</span><b>${(m.w / clanK * 100).toFixed(1)}%</b></div>
    </div>
    <p class="hint" style="margin-top:12px">${snap.prev ? '已有多天数据，后续可看每日增量。' : '目前只有一份快照，等有第二天数据后会显示每日增量。'}</p>
  `);
}

/* ================= 待关注 ================= */
function watchData() {
  const snap = snapshot(view.date);
  const list = [...snap.members.values()];
  const acc = new Map();
  for (const m of list) {
    const a = acc.get(m.clan) || { k: 0, n: 0 };
    a.k += m.w; a.n++; acc.set(m.clan, a);
  }
  const zero = list.filter(m => m.w === 0);
  const half = list.filter(m => m.w > 0 && m.w < (acc.get(m.clan).k / acc.get(m.clan).n) * 0.5);
  return { zero, half };
}
function showWatch(kind) {
  const w = watchData();
  const rows = kind === 'zero' ? w.zero : w.half;
  openModal(kind === 'zero' ? `零战功（${rows.length} 人）` : `低于门阀人均一半（${rows.length} 人）`, `
    <div class="tableWrap"><table>
      <thead><tr><th style="width:34px">#</th><th class="l">成员</th><th class="l">门阀</th><th>战功</th></tr></thead>
      <tbody>${rows.map((m, i) => `<tr><td class="muted">${i + 1}</td><td class="l">${esc(m.name)}</td>
        <td class="l muted">${esc(m.clan)}</td><td>${fmt(m.w)}</td></tr>`).join('')}</tbody>
    </table></div>
  `);
}

/* ================= 战报长图 ================= */
const POSTER_COLORS = ['#4f7cff','#10b3a3','#f59e0b','#8b5cf6','#ef4444','#0ea5c6','#84cc16','#64748b'];
let posterCanvas = null;
function rr(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function drawPoster() {
  const ds = dates();
  if (!ds.length) return null;
  const snap = snapshot(view.date);
  const list = [...snap.members.values()];
  const totalW = list.reduce((s, m) => s + m.w, 0);
  const totalA = list.reduce((s, m) => s + m.a, 0);
  const top = list.slice().sort((a, b) => b.w - a.w).slice(0, 10);
  const cm = new Map();
  for (const m of list) {
    const c = cm.get(m.clan) || { name: m.clan, k: 0 };
    c.k += m.w; cm.set(m.clan, c);
  }
  const clans = [...cm.values()].sort((a, b) => b.k - a.k);
  const W = 1080, PAD = 64, BAND = 340, ROW = 74, CROW = 64;
  const TOP_Y = BAND + 200;
  const CLAN_Y = TOP_Y + 46 + top.length * ROW + 52;
  const H = CLAN_Y + 34 + clans.length * CROW + 120;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, W, H);
  const bg = g.createLinearGradient(0, 0, W, BAND);
  bg.addColorStop(0, '#3563ef'); bg.addColorStop(1, '#7a9dff');
  g.fillStyle = bg;
  g.beginPath();
  g.moveTo(0, 0); g.lineTo(W, 0); g.lineTo(W, BAND - 44);
  g.quadraticCurveTo(W, BAND, W - 44, BAND);
  g.lineTo(44, BAND); g.quadraticCurveTo(0, BAND, 0, BAND - 44);
  g.closePath(); g.fill();

  const font = (size, weight, color) => {
    g.font = `${weight || 400} ${size}px -apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif`;
    g.fillStyle = color;
  };
  font(46, 700, '#ffffff'); g.fillText('同盟战功统计看板', PAD, 112);
  font(26, 400, 'rgba(255,255,255,.8)'); g.fillText(`${view.date} · 本周战功快照`, PAD, 158);
  font(26, 400, 'rgba(255,255,255,.72)'); g.fillText('本周战功', PAD, 232);
  font(84, 700, '#ffffff'); g.fillText(fmt(totalW), PAD, 316);

  const sw = (W - PAD * 2) / 3;
  [['本周助攻', fmt(totalA)], ['成员', String(list.length)], ['门阀', String(clans.length)]].forEach(([k, v], i) => {
    const cx = PAD + i * sw;
    if (i) { g.fillStyle = '#eef1f6'; g.fillRect(cx - 28, BAND + 26, 1, 66); }
    font(22, 400, '#8b93a3'); g.fillText(k, cx, BAND + 52);
    font(38, 700, '#1b2230'); g.fillText(v, cx, BAND + 98);
  });
  g.fillStyle = '#eef1f6'; g.fillRect(PAD, BAND + 150, W - PAD * 2, 1);

  font(34, 700, '#1b2230'); g.fillText('战功 TOP 10', PAD, TOP_Y);
  g.textAlign = 'right'; font(24, 400, '#6d7787'); g.fillText('本周累计', W - PAD, TOP_Y); g.textAlign = 'left';
  const maxTop = Math.max(...top.map(t => t.w), 1);
  top.forEach((m, i) => {
    const y = TOP_Y + 46 + i * ROW;
    const first = i === 0;
    g.fillStyle = first ? '#3563ef' : '#f1f4fa';
    g.beginPath(); g.arc(PAD + 18, y + 6, 18, 0, Math.PI * 2); g.fill();
    g.textAlign = 'center';
    font(22, 700, first ? '#ffffff' : '#6d7787'); g.fillText(String(i + 1), PAD + 18, y + 13);
    g.textAlign = 'left';
    font(30, 500, '#1b2230'); g.fillText(m.name, PAD + 56, y + 15);
    const bx = PAD + 380, bw = 380;
    g.fillStyle = '#f1f4fa'; rr(g, bx, y - 2, bw, 14, 7); g.fill();
    g.fillStyle = POSTER_COLORS[i % POSTER_COLORS.length];
    rr(g, bx, y - 2, Math.max(16, bw * m.w / maxTop), 14, 7); g.fill();
    g.textAlign = 'right'; font(30, 600, '#1b2230'); g.fillText(fmt(m.w), W - PAD, y + 15); g.textAlign = 'left';
  });

  font(34, 700, '#1b2230'); g.fillText('门阀战功分布', PAD, CLAN_Y);
  g.textAlign = 'right'; font(24, 400, '#6d7787'); g.fillText(`${clans.length} 个门阀`, W - PAD, CLAN_Y); g.textAlign = 'left';
  const maxClan = Math.max(...clans.map(t => t.k), 1);
  clans.forEach((m, i) => {
    const y = CLAN_Y + 36 + i * CROW;
    font(28, 500, '#1b2230'); g.fillText(m.name, PAD, y + 12);
    const bx = PAD + 240, bw = 560;
    g.fillStyle = '#f1f4fa'; rr(g, bx, y - 2, bw, 12, 6); g.fill();
    g.fillStyle = POSTER_COLORS[i % POSTER_COLORS.length];
    rr(g, bx, y - 2, Math.max(14, bw * m.k / maxClan), 12, 6); g.fill();
    g.textAlign = 'right'; font(28, 600, '#1b2230'); g.fillText(fmt(m.k), W - PAD, y + 12); g.textAlign = 'left';
  });

  font(22, 400, '#98a2b3');
  g.fillText('xwh77.github.io/alliance-stats', PAD, H - 52);
  g.textAlign = 'right';
  g.fillText('生成于 ' + new Date().toLocaleString('zh-CN', { hour12: false }), W - PAD, H - 52);
  return c;
}
function showPoster() {
  const c = drawPoster();
  if (!c) return;
  posterCanvas = c;
  openModal('战报长图', `
    <img class="posterImg" alt="战报长图" src="${c.toDataURL('image/png')}">
    <p class="hint" style="margin:10px 0 12px">长按图片可直接保存到相册，或点下面的按钮下载。</p>
    <div class="row"><button class="btn primary" data-act="savePoster">保存图片</button></div>
  `);
}
function savePoster() {
  if (!posterCanvas) return;
  posterCanvas.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `同盟战报-${view.date}.png`;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  }, 'image/png');
}

/* 弹层交互 */
document.addEventListener('click', e => {
  if (e.target.closest('[data-close]') || e.target.id === 'modal') { closeModal(); return; }
  const act = e.target.closest('[data-act]');
  if (act) {
    const a = act.dataset.act;
    if (a === 'poster') { showPoster(); return; }
    if (a === 'savePoster') { savePoster(); return; }
    if (a === 'watch') { showWatch(act.dataset.kind); return; }
  }
  const mb = e.target.closest('[data-member]');
  if (mb) showMember(mb.dataset.member);
});

/* ================= 动效 & 配色 ================= */
function countUp(el, target) {
  if (!target || typeof requestAnimationFrame !== 'function') return;
  const dur = 720, t0 = performance.now();
  const step = t => {
    const p = Math.min(1, (t - t0) / dur);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(target * e).toLocaleString('zh-CN');
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
document.addEventListener('click', e => {
  if (!e.target.closest('#themeBtn')) return;
  const dark = document.documentElement.dataset.theme === 'dark';
  if (dark) delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = 'dark';
  try { localStorage.setItem('theme', dark ? 'light' : 'dark'); } catch (err) {}
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = dark ? '#f4f6f9' : '#0e1117';
});

/* ================= 启动 ================= */
load();
if (dates().length < 2) view.mode = 'week';
renderAll();
</script>
</body>
</html>
