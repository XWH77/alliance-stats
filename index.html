<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100e0a">
<script>try{var _t=localStorage.getItem('theme');if(_t==='jade')document.documentElement.dataset.theme='jade'}catch(e){}</script>
<meta name="description" content="每日导入战功数据，查看同盟成员当日排行、门阀分布、人员变动与周度累计。">
<meta property="og:title" content="同盟战功统计看板">
<meta property="og:description" content="每日导入战功数据，查看同盟成员当日排行、门阀分布、人员变动与周度累计。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a1610'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23c9a96e'%3E盟%3C/text%3E%3C/svg%3E">
<title>同盟战功统计看板</title>
<style>
:root{
  --bg:#0e0c08; --bg2:#151109;
  --panel-a:42,34,22; --panel-b:24,20,13;
  --line:rgba(201,169,110,.15);
  --glow:201,169,110;
  --gold:#d5b57a; --gold2:#f2e6cc; --dim:#96845f;
  --good:#8acb8a; --bad:#e29b8a;
  --r:18px;
  --shadow:0 24px 50px -34px rgba(0,0,0,.95);
}
html[data-theme="jade"]{
  --bg:#07100d; --bg2:#0b1713;
  --panel-a:24,46,39; --panel-b:12,26,22;
  --line:rgba(126,209,186,.15);
  --glow:126,209,186;
  --gold:#7fd1b9; --gold2:#d9f5ec; --dim:#71a094;
  --good:#8acb8a; --bad:#e29b8a;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--gold2);
  font:15px/1.55 -apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  overflow-x:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
a{color:var(--gold)}

/* 背景光斑 */
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;display:block;border-radius:50%;filter:blur(70px);opacity:.55;animation:drift 22s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:70vw;height:70vw;left:-16vw;top:-20vh;background:radial-gradient(circle,rgba(var(--glow),.22),transparent 62%);animation-duration:19s}
.aurora i:nth-child(2){width:55vw;height:55vw;right:-12vw;top:6vh;background:radial-gradient(circle,rgba(var(--glow),.15),transparent 62%);animation-duration:26s;animation-delay:-6s}
.aurora i:nth-child(3){width:66vw;height:66vw;left:8vw;bottom:-24vh;background:radial-gradient(circle,rgba(var(--glow),.11),transparent 64%);animation-duration:31s;animation-delay:-12s}
@keyframes drift{
  0%{transform:translate3d(0,0,0) scale(1)}
  50%{transform:translate3d(3vw,-2vh,0) scale(1.08)}
  100%{transform:translate3d(-2vw,3vh,0) scale(.96)}
}

/* header */
.top{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:14px 16px 12px;
  background:linear-gradient(180deg,rgba(14,12,8,.9),rgba(14,12,8,.55));
  backdrop-filter:blur(14px) saturate(1.2);
  border-bottom:1px solid var(--line);
  padding-top:calc(14px + env(safe-area-inset-top));
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.seal{
  width:42px;height:42px;flex:0 0 42px;border-radius:13px;
  display:grid;place-items:center;
  background:linear-gradient(150deg,rgba(var(--glow),.22),rgba(var(--glow),.04));
  border:1px solid rgba(var(--glow),.45);
  color:var(--gold);font-size:20px;font-weight:700;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 0 26px -6px rgba(var(--glow),.5);
  animation:sealPulse 4s ease-in-out infinite;
}
@keyframes sealPulse{0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 0 22px -8px rgba(var(--glow),.45)}50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 0 34px -2px rgba(var(--glow),.6)}}
.brand h1{font-size:17px;letter-spacing:.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:11px;color:var(--dim);letter-spacing:1.6px;margin-top:2px}
.topRight{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.dateSel{
  background:rgba(var(--panel-a),.7);border:1px solid var(--line);border-radius:11px;
  padding:7px 10px;font-size:12.5px;color:var(--gold2);outline:none;max-width:126px;
}
.badge{font-size:11px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.badge.demo{color:var(--gold);border-color:rgba(var(--glow),.4);background:rgba(var(--glow),.08)}
.iconBtn{
  width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  background:rgba(var(--panel-a),.7);border:1px solid var(--line);
  color:var(--gold);cursor:pointer;font-size:15px;line-height:1;padding:0;
  transition:transform .25s,border-color .25s;
}
.iconBtn:hover{transform:rotate(180deg);border-color:rgba(var(--glow),.5)}

/* nav */
.tabs{display:flex;gap:6px;padding:10px 16px 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  flex:0 0 auto;background:transparent;border:1px solid transparent;border-radius:999px;
  padding:8px 14px;font-size:13.5px;color:var(--dim);cursor:pointer;
  transition:color .2s,background .2s,transform .2s;
}
.tabs button:hover{color:var(--gold2);transform:translateY(-1px)}
.tabs button.on{
  color:#120e06;font-weight:700;
  background:linear-gradient(180deg,var(--gold2),var(--gold));
  border-color:rgba(var(--glow),.6);
  box-shadow:0 6px 20px -8px rgba(var(--glow),.7);
}

/* layout */
main{padding:14px 16px 40px;max-width:1080px;margin:0 auto}
.page{display:none}
.page.on{display:block;animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.rowIn{animation:rise .4s both}

.panel{
  background:linear-gradient(180deg,rgba(var(--panel-a),.78),rgba(var(--panel-b),.9));
  border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin-bottom:14px;
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.03);
  backdrop-filter:blur(10px);
  animation:rise .5s cubic-bezier(.2,.8,.2,1) both;
  transition:border-color .3s;
}
.panel:hover{border-color:rgba(var(--glow),.3)}
.panel h2{font-size:14px;font-weight:600;letter-spacing:.4px;color:var(--gold2);margin-bottom:12px}
.panelHead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.panelHead h2{margin:0}
.hint{font-size:12px;color:var(--dim);line-height:1.7}

/* cards */
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.card{
  position:relative;overflow:hidden;
  background:linear-gradient(160deg,rgba(var(--panel-a),.9),rgba(var(--panel-b),.9));
  border:1px solid var(--line);border-radius:var(--r);padding:14px;
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.04);
  animation:rise .55s cubic-bezier(.2,.8,.2,1) both;
  transition:transform .25s,border-color .25s;
}
.cards .card:nth-child(2){animation-delay:.05s}
.cards .card:nth-child(3){animation-delay:.1s}
.cards .card:nth-child(4){animation-delay:.15s}
.card:hover{transform:translateY(-3px);border-color:rgba(var(--glow),.35)}
.card::after{
  content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;
  background:radial-gradient(circle,rgba(var(--glow),.18),transparent 70%);
  animation:halo 6s ease-in-out infinite alternate;
}
@keyframes halo{from{transform:scale(1);opacity:.7}to{transform:scale(1.25);opacity:1}}
.card .lbl{font-size:12px;color:var(--dim);letter-spacing:.6px}
.card .val{
  font-size:27px;font-weight:700;margin-top:6px;color:var(--gold2);
  font-variant-numeric:tabular-nums;letter-spacing:-.5px;
  text-shadow:0 0 24px rgba(var(--glow),.25);
}
.card .cap{font-size:11.5px;color:var(--dim);margin-top:4px}
.card .cap.up{color:var(--good)}
.card .cap.down{color:var(--bad)}

.two{display:grid;grid-template-columns:1fr;gap:0}

/* chart */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-size:11px;fill:var(--dim)}
.chart .grid{stroke:rgba(var(--glow),.1);stroke-width:1;stroke-dasharray:3 5}
.chart .line{fill:none;stroke:var(--gold);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round;
  stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s .15s cubic-bezier(.4,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.chart .dot{fill:var(--gold2);stroke:var(--bg);stroke-width:1.5;animation:pop .4s both}
@keyframes pop{from{opacity:0}to{opacity:1}}

/* bars */
.bars{display:flex;flex-direction:column;gap:12px}
.barRow{display:grid;grid-template-columns:82px 1fr 64px;align-items:center;gap:10px}
.barRow .nm{font-size:12.5px;color:var(--gold2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barTrack{height:10px;border-radius:999px;background:rgba(var(--glow),.09);overflow:hidden}
.barFill{
  height:100%;border-radius:999px;
  background:linear-gradient(90deg,rgba(var(--glow),.55),var(--gold2));
  box-shadow:0 0 14px -2px rgba(var(--glow),.6);
  animation:grow .8s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes grow{from{width:0}}
.barRow .vv{text-align:right;font-size:12.5px;color:var(--gold2);font-variant-numeric:tabular-nums}

/* top5 */
.top5{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.top5 li{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:13px;
  background:rgba(var(--glow),.05);border:1px solid transparent;
  animation:rise .45s both;transition:background .25s,transform .25s;
}
.top5 li:hover{background:rgba(var(--glow),.1);transform:translateX(2px)}
.top5 li:nth-child(1){border-color:rgba(var(--glow),.4);background:rgba(var(--glow),.1)}
.top5 li:nth-child(2){animation-delay:.04s}
.top5 li:nth-child(3){animation-delay:.08s}
.top5 li:nth-child(4){animation-delay:.12s}
.top5 li:nth-child(5){animation-delay:.16s}
.rk{
  width:24px;height:24px;flex:0 0 24px;border-radius:50%;display:grid;place-items:center;
  font-size:12px;font-weight:700;background:rgba(var(--glow),.15);color:var(--gold);
}
.top5 .nm{flex:1;font-size:13.5px}
.top5 .nm small{color:var(--dim);font-size:11px;margin-left:6px}
.top5 .vv{font-size:13.5px;color:var(--gold2);font-variant-numeric:tabular-nums}

/* table */
.tableWrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{color:var(--dim);font-weight:500;text-align:right;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px}
th:first-child,td:first-child{text-align:left}
td{padding:10px 8px;border-bottom:1px dashed rgba(var(--glow),.1);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
tbody tr{transition:background .2s}
tbody tr:hover{background:rgba(var(--glow),.05)}
th.l,td.l{text-align:left}
.muted{color:var(--dim)}
.tag{font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
.tag.on{color:var(--good);border-color:rgba(131,189,131,.35);background:rgba(131,189,131,.08)}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.seg{display:inline-flex;background:rgba(var(--panel-a),.7);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{background:transparent;border:none;border-radius:999px;padding:6px 14px;font-size:13px;color:var(--dim);cursor:pointer;transition:.2s}
.seg button:hover:not(:disabled){color:var(--gold2)}
.seg button.on{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#120e06;font-weight:700;box-shadow:0 4px 14px -6px rgba(var(--glow),.7)}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.search{background:rgba(var(--panel-a),.7);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;outline:none;min-width:150px;transition:border-color .25s,box-shadow .25s}
.search:focus{border-color:rgba(var(--glow),.55);box-shadow:0 0 0 3px rgba(var(--glow),.12)}
.search::placeholder{color:var(--dim)}

/* buttons */
.btn{
  background:rgba(var(--panel-a),.8);border:1px solid var(--line);border-radius:11px;
  padding:9px 14px;font-size:13px;color:var(--gold2);cursor:pointer;transition:.2s;
}
.btn:hover{border-color:rgba(var(--glow),.5);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#120e06;border-color:transparent;font-weight:700}
.btn.danger{color:var(--bad);border-color:rgba(226,155,138,.3)}
.btn:active{transform:translateY(1px)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}

/* empty */
.empty{padding:34px 16px;text-align:center}
.empty p{font-size:15px;margin-bottom:6px}
.empty .hint{margin-bottom:16px}

/* footer */
.foot{text-align:center;font-size:11px;color:var(--dim);padding:8px 0 30px}

/* mobile */
@media (max-width:640px){
  main{padding:12px 12px 96px}
  .card .val{font-size:22px}
  .tabs{
    position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:rgba(10,9,6,.92);backdrop-filter:blur(16px);
    border-top:1px solid var(--line);
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    justify-content:space-around;gap:2px;overflow:visible;
  }
  .tabs button{flex:1;padding:7px 4px;font-size:12.5px;border-radius:11px}
  .tabs button.on{background:transparent;color:var(--gold);box-shadow:none;font-weight:700}
  .tabs button.on::before{content:"";display:block;width:18px;height:2px;border-radius:2px;background:var(--gold);margin:0 auto 4px}
  .top{padding-left:12px;padding-right:12px;gap:8px}
  .brand h1{font-size:15px}
  .sub{display:none}
  .dateSel{max-width:112px;font-size:12px;padding:6px 8px}
  .badge{display:none}
  .iconBtn{width:30px;height:30px;font-size:13px}
  .barRow{grid-template-columns:72px 1fr 58px;gap:8px}
}
@media (min-width:641px){
  .cards{grid-template-columns:repeat(4,1fr)}
  .two{grid-template-columns:1.15fr 1fr;gap:14px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>

<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

<header class="top">
  <div class="brand">
    <div class="seal">盟</div>
    <div>
      <h1>同盟战功统计看板</h1>
      <p class="sub">门阀 · 战功 · 助攻 · 活跃</p>
    </div>
  </div>
  <div class="topRight">
    <select id="dateSel" class="dateSel" aria-label="数据日期"></select>
    <button class="iconBtn" id="themeBtn" title="切换配色" aria-label="切换配色">◐</button>
    <span class="badge" id="dataBadge">示例数据</span>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button data-page="dash" class="on">仪表盘</button>
  <button data-page="rank">全盟排行</button>
  <button data-page="clan">门阀排行</button>
</nav>

<main>
  <section class="page on" id="page-dash"></section>
  <section class="page" id="page-rank"></section>
  <section class="page" id="page-clan"></section>
  <p class="foot">数据保存在本机浏览器 · 换设备或清缓存不保留</p>
</main>

<script src="data.js"></script>
<script>
/* ================= 工具 ================= */
const $ = (s, r = document) => r.querySelector(s);
const fmt = n => Number(n || 0).toLocaleString('zh-CN');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WEEK = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];

/* ================= 数据层 ================= */
const KEY = 'alliance_stats_v2';
let db = { records: [], imports: [], snapshot: false };
let view = { page: 'dash', date: null, mode: 'week', q: '' };
let S = null;                       // 派生缓存

const snapKey = () => window.SNAPSHOT ? window.SNAPSHOT.date + ':' + window.SNAPSHOT.rows.length : '';

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const o = JSON.parse(raw);
      if (o && Array.isArray(o.records) && o.records.length) {
        db = { records: o.records, imports: o.imports || [], snapshot: !!o.snapshot, key: o.key || '' };
        if (db.snapshot && db.key !== snapKey()) { seedFromSnapshot(); return; }
        return;
      }
    }
  } catch (e) { /* 忽略损坏数据 */ }
  seedFromSnapshot();
}

/* 内置快照（data.js） */
function seedFromSnapshot() {
  const snap = window.SNAPSHOT;
  if (!snap || !Array.isArray(snap.rows)) { persist(); return; }
  db = {
    records: snap.rows.map(([n, c, w, a, st, p]) => ({ d: snap.date, n, c, w, a, st, p })),
    imports: [], snapshot: true, key: snapKey()
  };
  persist();
}

function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { toast('保存失败：浏览器存储不可用'); }
}

function dates() { return [...new Set(db.records.map(r => r.d))].sort(); }
function rosterOf(d) {
  const m = new Map();
  for (const r of db.records) if (r.d === d) m.set(r.n, r);
  return m;
}
function data() {
  if (!S) {
    const ds = dates();
    S = { ds, maps: new Map(ds.map(d => [d, rosterOf(d)])) };
  }
  return S;
}
function latestRec(name, date) {
  const { ds, maps } = data();
  for (let i = ds.indexOf(date); i >= 0; i--) {
    const r = maps.get(ds[i]).get(name);
    if (r) return r;
  }
  return null;
}

/* 当日增量：本周累计差值；若累计变小视为新一周，取当周值 */
function snapshot(date) {
  const { ds, maps } = data();
  const i = ds.indexOf(date);
  const out = new Map();
  if (i < 0) return { date, members: out, prev: null };
  const prev = i > 0 ? ds[i-1] : null;
  for (const [name, r] of maps.get(date)) {
    const p = prev ? latestRec(name, prev) : null;
    const inc  = p ? (r.w < p.w ? r.w : r.w - p.w) : 0;
    const ainc = p ? (r.a < p.a ? r.a : r.a - p.a) : 0;
    out.set(name, { name, clan: r.c, w: r.w, a: r.a, st: r.st, p: r.p, inc, ainc, base: !!p });
  }
  return { date, members: out, prev };
}

function totalsAll() {
  const { ds, maps } = data();
  const res = new Map();
  let prev = new Map();
  for (const d of ds) {
    const cur = maps.get(d);
    for (const [name, r] of cur) {
      const p = prev.get(name);
      const inc  = p ? (r.w < p.w ? r.w : r.w - p.w) : 0;
      const ainc = p ? (r.a < p.a ? r.a : r.a - p.a) : 0;
      const t = res.get(name) || { name, clan: r.c, k: 0, a: 0 };
      t.k += inc; t.a += ainc; t.clan = r.c;
      res.set(name, t);
    }
    prev = cur;
  }
  return res;
}

/* ================= 渲染：框架 ================= */
function setPage(p) {
  view.page = p;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.page === p));
  document.querySelectorAll('.page').forEach(el => el.classList.toggle('on', el.id === 'page-' + p));
  renderPage();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function renderAll() {
  const ds = dates();
  if (!view.date || !ds.includes(view.date)) view.date = ds.length ? ds[ds.length-1] : null;
  const sel = $('#dateSel');
  if (ds.length) {
    sel.style.display = '';
    sel.innerHTML = ds.slice().reverse().map(d => `<option value="${d}">${d}</option>`).join('');
    sel.value = view.date;
  } else {
    sel.style.display = 'none';
  }
  const badge = $('#dataBadge');
  badge.style.display = ds.length ? '' : 'none';
  badge.textContent = db.snapshot ? `快照 ${ds[ds.length-1]}` : '本地数据';
  badge.classList.toggle('demo', db.snapshot);
  renderPage();
}
function renderPage() {
  if (view.page === 'dash') renderDash();
  else if (view.page === 'rank') renderRank();
  else renderClan();
}

/* ================= 渲染：仪表盘 ================= */
function renderDash() {
  const el = $('#page-dash');
  const ds = dates();
  if (!ds.length) { el.innerHTML = emptyPanel(); return; }
  const snap = snapshot(view.date);
  const hasBase = !!snap.prev;
  const list = [...snap.members.values()];
  let k = 0, a = 0, active = 0;
  const clans = new Set(), byClan = new Map();
  for (const m of list) {
    const v = hasBase ? m.inc : m.w, va = hasBase ? m.ainc : m.a;
    k += v; a += va;
    if (m.inc > 0) active++;
    clans.add(m.clan);
    const c = byClan.get(m.clan) || { name: m.clan, k: 0, a: 0, n: 0 };
    c.k += v; c.a += va; c.n++; byClan.set(m.clan, c);
  }
  const bars = [...byClan.values()].sort((x, y) => y.k - x.k);
  const maxBar = Math.max(...bars.map(b => b.k), 1);
  const top = list.slice().sort((x, y) => (hasBase ? y.inc - x.inc : y.w - x.w)).slice(0, 5);
  const last7 = ds.slice(-7);
  const trend = last7.map(d => [...snapshot(d).members.values()].reduce((s, m) => s + m.inc, 0));

  let cards, chartPanel, changePanel;
  if (hasBase) {
    let pk = 0;
    for (const m of snapshot(snap.prev).members.values()) pk += m.inc;
    const delta = k - pk;
    cards = `
      <div class="card"><div class="lbl">今日战功</div><div class="val" data-v="${k}">${fmt(k)}</div>
        <div class="cap ${delta >= 0 ? 'up' : 'down'}">较昨日 ${delta >= 0 ? '+' : ''}${fmt(delta)}</div></div>
      <div class="card"><div class="lbl">今日助攻</div><div class="val" data-v="${a}">${fmt(a)}</div>
        <div class="cap">${snap.members.size} 名成员</div></div>
      <div class="card"><div class="lbl">活跃成员</div><div class="val" data-v="${active}">${active}</div>
        <div class="cap">有战功增量</div></div>
      <div class="card"><div class="lbl">门阀总数</div><div class="val" data-v="${clans.size}">${clans.size}</div>
        <div class="cap">${view.date} ${WEEK[new Date(view.date + 'T00:00:00').getDay()]}</div></div>`;
    chartPanel = `<div class="panel"><div class="panelHead"><h2>近 7 日战功趋势</h2><span class="hint">当日增量</span></div>${lineChart(trend, last7)}</div>`;
    const before = new Set(snapshot(snap.prev).members.keys()), now = new Set(snap.members.keys());
    const joined = [...now].filter(n => !before.has(n)), left = [...before].filter(n => !now.has(n));
    changePanel = `<div class="panel"><div class="panelHead"><h2>人员变动</h2><span class="hint">对比 ${snap.prev}</span></div>
      <div class="row" style="gap:22px;align-items:flex-start">
        <div><p class="hint" style="margin-bottom:6px">新进 ${joined.length}</p>
          <div class="row" style="gap:6px">${joined.map(n => `<span class="tag on">${esc(n)}</span>`).join('') || '<span class="muted" style="font-size:12px">无</span>'}</div></div>
        <div><p class="hint" style="margin-bottom:6px">离开 ${left.length}</p>
          <div class="row" style="gap:6px">${left.map(n => `<span class="tag">${esc(n)}</span>`).join('') || '<span class="muted" style="font-size:12px">无</span>'}</div></div>
      </div></div>`;
  } else {
    cards = `
      <div class="card"><div class="lbl">本周战功</div><div class="val" data-v="${k}">${fmt(k)}</div>
        <div class="cap">无昨日基线 · 本周累计</div></div>
      <div class="card"><div class="lbl">本周助攻</div><div class="val" data-v="${a}">${fmt(a)}</div>
        <div class="cap">${snap.members.size} 名成员</div></div>
      <div class="card"><div class="lbl">成员</div><div class="val" data-v="${snap.members.size}">${snap.members.size}</div>
        <div class="cap">${clans.size} 个门阀</div></div>
      <div class="card"><div class="lbl">人均战功</div><div class="val" data-v="${Math.round(k / Math.max(snap.members.size, 1))}">${fmt(Math.round(k / Math.max(snap.members.size, 1)))}</div>
        <div class="cap">${view.date}</div></div>`;
    const top10 = list.slice().sort((x, y) => y.w - x.w).slice(0, 10);
    const mx = Math.max(...top10.map(m => m.w), 1);
    chartPanel = `<div class="panel"><div class="panelHead"><h2>战功 TOP 10</h2><span class="hint">本周累计</span></div>
      <div class="bars">${top10.map((m, i) => `
        <div class="barRow"><div class="nm" title="${esc(m.name)}">${i + 1}. ${esc(m.name)}</div>
          <div class="barTrack"><div class="barFill" style="width:${Math.max(2, m.w / mx * 100)}%"></div></div>
          <div class="vv">${fmt(m.w)}</div></div>`).join('')}</div></div>`;
    changePanel = `<div class="panel"><div class="panelHead"><h2>人员变动</h2><span class="hint">暂无对比</span></div>
      <p class="hint">这是第一份快照。明天再导入一份，就能看到当日增量、新进和离开。</p></div>`;
  }

  el.innerHTML = `<div class="cards">${cards}</div>${chartPanel}
    <div class="two">
      <div class="panel"><div class="panelHead"><h2>门阀战功分布</h2><span class="hint">${view.date}</span></div>
        <div class="bars">${bars.map(b => `
          <div class="barRow"><div class="nm" title="${esc(b.name)}">${esc(b.name)}</div>
            <div class="barTrack"><div class="barFill" style="width:${Math.max(2, b.k / maxBar * 100)}%"></div></div>
            <div class="vv">${fmt(b.k)}</div></div>`).join('') || '<p class="hint">暂无门阀数据</p>'}
        </div>
      </div>
      <div class="panel"><div class="panelHead"><h2>${hasBase ? '今日' : '本周'} TOP 5</h2><span class="hint">${hasBase ? '战功增量' : '累计战功'}</span></div>
        <ol class="top5">${top.map((m, i) => `
          <li><span class="rk">${i + 1}</span>
            <span class="nm">${esc(m.name)}<small>${esc(m.clan)}</small></span>
            <span class="vv">${hasBase ? '+' : ''}${fmt(hasBase ? m.inc : m.w)}</span></li>`).join('') || '<p class="hint">暂无数据</p>'}
        </ol>
      </div>
    </div>${changePanel}`;
  el.querySelectorAll('.val[data-v]').forEach(n => countUp(n, Number(n.dataset.v)));
}

/* ================= 渲染：排行 ================= */
function rankRows() {
  const snap = snapshot(view.date);
  const tot = view.mode === 'total' ? totalsAll() : null;
  const rows = [];
  for (const m of snap.members.values()) {
    let k = m.inc, a = m.ainc;
    if (view.mode === 'week') { k = m.w; a = m.a; }
    if (view.mode === 'total') { const t = tot.get(m.name) || { k: 0, a: 0 }; k = t.k; a = t.a; }
    rows.push({ name: m.name, clan: m.clan, k, a, st: m.st, p: m.p, active: m.inc > 0 });
  }
  return rows.sort((x, y) => y.k - x.k || y.a - x.a);
}
function renderRank() {
  const el = $('#page-rank');
  if (!dates().length) { el.innerHTML = emptyPanel(); return; }
  const hasBase = !!snapshot(view.date).prev;
  const canTotal = dates().length > 1;
  if (!hasBase && view.mode === 'today') view.mode = 'week';
  if (!canTotal && view.mode === 'total') view.mode = 'week';
  const rows = rankRows();
  const maxK = Math.max(...rows.map(r => r.k), 1);
  const label = view.mode === 'today' ? '今日战功' : view.mode === 'week' ? '本周战功' : '累计战功';
  el.innerHTML = `
    <div class="toolbar">
      <div class="seg" id="rankMode">
        <button data-mode="today" class="${view.mode === 'today' ? 'on' : ''}" ${hasBase ? '' : 'disabled'}>今日</button>
        <button data-mode="week" class="${view.mode === 'week' ? 'on' : ''}">本周</button>
        <button data-mode="total" class="${view.mode === 'total' ? 'on' : ''}" ${canTotal ? '' : 'disabled'}>累计</button>
      </div>
      <input class="search" id="q" placeholder="搜索成员 / 门阀 / 州" value="${esc(view.q)}">
    </div>
    <div class="panel tableWrap">
      <table>
        <thead><tr><th style="width:38px">#</th><th class="l">成员</th><th>${label}</th>
          <th>助攻</th><th>势力</th><th class="l" style="width:84px">占比</th></tr></thead>
        <tbody id="rankBody">${rows.length ? rows.map((r, i) => {
          const show = !view.q || (r.name + r.clan + (r.st || '')).toLowerCase().includes(view.q.toLowerCase());
          return `<tr class="${i < 15 ? 'rowIn' : ''}" style="${i < 15 ? `animation-delay:${i * 14}ms` : ''}" data-name="${esc(r.name + ' ' + r.clan + ' ' + (r.st || ''))}" ${show ? '' : 'hidden'}>
            <td class="muted">${i + 1}</td>
            <td class="l"><div>${esc(r.name)}${r.active && hasBase && view.mode === 'today' ? ' <span class="tag on">活跃</span>' : ''}</div>
              <div class="muted" style="font-size:11.5px">${esc(r.clan)}${r.st ? ' · ' + esc(r.st) : ''}</div></td>
            <td>${fmt(r.k)}</td><td class="muted">${fmt(r.a)}</td>
            <td class="muted">${r.p ? fmt(r.p) : '—'}</td>
            <td class="l"><div class="barTrack" style="height:6px"><div class="barFill" style="width:${Math.max(1, r.k / maxK * 100)}%"></div></div></td>
          </tr>`;
        }).join('') : '<tr><td colspan="6" class="muted" style="text-align:center;padding:22px">暂无数据</td></tr>'}
        </tbody>
      </table>
    </div>
    <p class="hint">${view.mode === 'week' ? '本周战功为游戏内本周累计值。' : view.mode === 'total' ? '累计 = 每日增量之和；第一次出现时没有基线，按 0 计。' : '今日战功 = 今日累计 − 昨日本周累计；累计回落视为新一周。'}</p>`;
}
function emptyPanel() {
  return `<div class="panel empty"><p>暂时没有数据</p>
    <p class="hint">数据还没发布，稍后再打开看看。</p></div>`;
}

/* ================= 渲染：门阀 ================= */
function renderClan() {
  const el = $('#page-clan');
  if (!dates().length) { el.innerHTML = emptyPanel(); return; }
  const snap = snapshot(view.date);
  const hasBase = !!snap.prev;
  const map = new Map();
  for (const m of snap.members.values()) {
    const v = hasBase ? m.inc : m.w, va = hasBase ? m.ainc : m.a;
    const c = map.get(m.clan) || { name: m.clan, n: 0, k: 0, a: 0, active: 0 };
    c.n++; c.k += v; c.a += va; if (m.inc > 0) c.active++;
    map.set(m.clan, c);
  }
  const rows = [...map.values()].sort((x, y) => y.k - x.k);
  const total = rows.reduce((s, r) => s + r.k, 0) || 1;
  const maxK = Math.max(...rows.map(r => r.k), 1);
  const label = hasBase ? '今日战功' : '本周战功';
  el.innerHTML = `
    <div class="panel">
      <div class="panelHead"><h2>门阀战功排行</h2><span class="hint">${view.date}</span></div>
      <div class="bars">${rows.map(r => `
        <div class="barRow"><div class="nm" title="${esc(r.name)}">${esc(r.name)}</div>
          <div class="barTrack"><div class="barFill" style="width:${Math.max(2, r.k / maxK * 100)}%"></div></div>
          <div class="vv">${fmt(r.k)}</div></div>`).join('')}
      </div>
    </div>
    <div class="panel tableWrap">
      <table>
        <thead><tr><th class="l">门阀</th><th>人数</th><th>${label}</th><th>助攻</th><th>人均</th><th>占比</th></tr></thead>
        <tbody>${rows.map(r => `<tr>
          <td class="l">${esc(r.name)}</td><td>${r.n}</td><td>${fmt(r.k)}</td>
          <td class="muted">${fmt(r.a)}</td><td class="muted">${fmt(Math.round(r.k / r.n))}</td>
          <td class="muted">${(r.k / total * 100).toFixed(1)}%</td></tr>`).join('')}
        </tbody>
      </table>
    </div>`;
}

/* ================= 图表 ================= */
function lineChart(points, labels) {
  if (!points.length) return '<p class="hint">暂无数据</p>';
  const W = 600, H = 190, L = 48, R = 14, T = 16, B = 28;
  const maxV = Math.max(...points, 1) * 1.15;
  const X = i => L + (W - L - R) * (i / Math.max(points.length - 1, 1));
  const Y = v => H - B - (v / maxV) * (H - T - B);
  const pts = points.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`);
  const area = `M${X(0).toFixed(1)},${H - B} L` + pts.join(' L') + ` L${X(points.length - 1).toFixed(1)},${H - B} Z`;
  const grid = [0, 0.5, 1].map(r => {
    const y = (H - B - r * (H - T - B)).toFixed(1);
    const val = Math.round(maxV * r);
    return `<line class="grid" x1="${L}" y1="${y}" x2="${W - R}" y2="${y}"></line>
      <text x="${L - 8}" y="${Number(y) + 4}" text-anchor="end">${val >= 10000 ? (val / 10000).toFixed(1) + '万' : fmt(val)}</text>`;
  }).join('');
  const xlabels = labels.map((t, i) => i % 2 === 0 || i === labels.length - 1
    ? `<text x="${X(i).toFixed(1)}" y="${H - 8}" text-anchor="middle">${t.slice(5)}</text>` : '').join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="战功趋势">
    <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--gold)" stop-opacity=".28"/>
      <stop offset="100%" stop-color="var(--gold)" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}
    <path d="${area}" fill="url(#g1)"></path>
    <polyline class="line" pathLength="1" points="${pts.join(' ')}"></polyline>
    ${points.map((v, i) => `<circle class="dot" cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="2.6"></circle>`).join('')}
    ${xlabels}
  </svg>`;
}

/* ================= 交互 ================= */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-page]');
  if (b) { setPage(b.dataset.page); return; }
  const m = e.target.closest('#rankMode button');
  if (m && !m.disabled) { view.mode = m.dataset.mode; renderRank(); }
});

document.addEventListener('input', e => {
  if (e.target.id === 'q') {
    view.q = e.target.value;
    const q = view.q.toLowerCase();
    document.querySelectorAll('#rankBody tr[data-name]').forEach(tr => {
      tr.hidden = q && !tr.dataset.name.toLowerCase().includes(q);
    });
  }
});

$('#dateSel').addEventListener('change', e => { view.date = e.target.value; renderAll(); });

/* ================= 动效 & 配色 ================= */
function countUp(el, target) {
  if (!target || typeof requestAnimationFrame !== 'function') return;
  const dur = 720, t0 = performance.now();
  const step = t => {
    const p = Math.min(1, (t - t0) / dur);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(target * e).toLocaleString('zh-CN');
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
document.addEventListener('click', e => {
  if (!e.target.closest('#themeBtn')) return;
  const jade = document.documentElement.dataset.theme === 'jade';
  if (jade) delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = 'jade';
  try { localStorage.setItem('theme', jade ? 'gold' : 'jade'); } catch (err) {}
});

/* ================= 启动 ================= */
load();
if (dates().length < 2) view.mode = 'week';
renderAll();
</script>
</body>
</html>
