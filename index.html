<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100e0a">
<meta name="description" content="每日导入战功数据，查看同盟成员当日排行、门阀分布、人员变动与周度累计。">
<meta property="og:title" content="同盟战功统计看板">
<meta property="og:description" content="每日导入战功数据，查看同盟成员当日排行、门阀分布、人员变动与周度累计。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a1610'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23c9a96e'%3E盟%3C/text%3E%3C/svg%3E">
<title>同盟战功统计看板</title>
<style>
:root{
  --bg:#100e0a; --panel:#1a1610; --panel2:#221b12; --line:rgba(201,169,110,.18);
  --gold:#c9a96e; --gold2:#e8d5a8; --dim:#8d7d5e; --good:#83bd83; --bad:#d98b7a;
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(900px 520px at 88% -12%, rgba(201,169,110,.10), transparent 62%),
    radial-gradient(700px 420px at -10% 112%, rgba(201,169,110,.06), transparent 60%),
    var(--bg);
  background-attachment:fixed;
  color:var(--gold2);
  font:15px/1.55 -apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
a{color:var(--gold)}

/* header */
.top{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 16px 12px;
  background:linear-gradient(180deg, rgba(16,14,10,.94), rgba(16,14,10,.72));
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  padding-top:calc(14px + env(safe-area-inset-top));
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.seal{
  width:42px;height:42px;flex:0 0 42px;border-radius:12px;
  display:grid;place-items:center;
  background:linear-gradient(145deg,#33281a,#211a10);
  border:1px solid rgba(201,169,110,.45);
  color:var(--gold);font-size:20px;font-weight:700;
  box-shadow:inset 0 1px 0 rgba(232,213,168,.18), 0 4px 14px rgba(0,0,0,.35);
}
.brand h1{font-size:17px;letter-spacing:.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:11px;color:var(--dim);letter-spacing:1.5px;margin-top:2px}
.topRight{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.dateSel{
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  padding:7px 10px;font-size:12.5px;color:var(--gold2);outline:none;
  max-width:132px;
}
.badge{
  font-size:11px;padding:4px 9px;border-radius:999px;
  border:1px solid var(--line);color:var(--dim);white-space:nowrap;
}
.badge.demo{color:#e2c26b;border-color:rgba(226,194,107,.4);background:rgba(226,194,107,.08)}

/* nav */
.tabs{
  display:flex;gap:6px;padding:10px 16px 0;overflow-x:auto;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  flex:0 0 auto;background:transparent;border:1px solid transparent;border-radius:999px;
  padding:8px 14px;font-size:13.5px;color:var(--dim);cursor:pointer;transition:.18s;
}
.tabs button:hover{color:var(--gold2)}
.tabs button.on{
  color:#1a1409;font-weight:600;
  background:linear-gradient(180deg,#e8d5a8,#c9a96e);
  border-color:#e8d5a8;
  box-shadow:0 3px 12px rgba(201,169,110,.22);
}

/* layout */
main{padding:14px 16px 40px;max-width:1080px;margin:0 auto}
.page{display:none;animation:fade .22s ease}
.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.panel{
  background:linear-gradient(180deg, rgba(34,27,18,.85), rgba(26,22,16,.85));
  border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin-bottom:14px;
}
.panel h2{font-size:14px;font-weight:600;letter-spacing:.4px;color:var(--gold2);margin-bottom:12px}
.panelHead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.panelHead h2{margin:0}
.hint{font-size:12px;color:var(--dim);line-height:1.7}

/* cards */
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.card{
  background:linear-gradient(150deg, rgba(44,35,22,.9), rgba(26,22,16,.9));
  border:1px solid var(--line);border-radius:var(--r);padding:14px;
  position:relative;overflow:hidden;
}
.card::after{
  content:"";position:absolute;right:-24px;top:-24px;width:70px;height:70px;border-radius:50%;
  background:radial-gradient(circle, rgba(201,169,110,.16), transparent 70%);
}
.card .lbl{font-size:12px;color:var(--dim);letter-spacing:.6px}
.card .val{font-size:26px;font-weight:700;margin-top:6px;color:var(--gold2);font-variant-numeric:tabular-nums}
.card .cap{font-size:11.5px;color:var(--dim);margin-top:4px}
.card .cap.up{color:var(--good)}
.card .cap.down{color:var(--bad)}

/* two column */
.two{display:grid;grid-template-columns:1fr;gap:0}

/* chart */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-size:11px;fill:var(--dim)}
.chart .grid{stroke:rgba(201,169,110,.10);stroke-width:1}
.chart .line{fill:none;stroke:#d9bd82;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:#e8d5a8;stroke:#1a1610;stroke-width:1.5}

/* clan bars */
.bars{display:flex;flex-direction:column;gap:12px}
.barRow{display:grid;grid-template-columns:78px 1fr 62px;align-items:center;gap:10px}
.barRow .nm{font-size:12.5px;color:var(--gold2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barTrack{height:10px;border-radius:999px;background:rgba(201,169,110,.10);overflow:hidden}
.barFill{height:100%;border-radius:999px;background:linear-gradient(90deg,#8a6f3f,#d9bd82);transition:width .5s ease}
.barRow .vv{text-align:right;font-size:12.5px;color:var(--gold2);font-variant-numeric:tabular-nums}

/* top5 */
.top5{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.top5 li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:rgba(201,169,110,.05);border:1px solid transparent}
.top5 li:nth-child(1){border-color:rgba(226,194,107,.35);background:rgba(226,194,107,.09)}
.rk{width:24px;height:24px;flex:0 0 24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:rgba(201,169,110,.14);color:var(--gold)}
.top5 .nm{flex:1;font-size:13.5px}
.top5 .nm small{color:var(--dim);font-size:11px;margin-left:6px}
.top5 .vv{font-size:13.5px;color:var(--gold2);font-variant-numeric:tabular-nums}

/* table */
.tableWrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{color:var(--dim);font-weight:500;text-align:right;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px}
th:first-child,td:first-child{text-align:left}
td{padding:10px 8px;border-bottom:1px dashed rgba(201,169,110,.10);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(201,169,110,.04)}
th.l,td.l{text-align:left}
.muted{color:var(--dim)}
.tag{font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
.tag.on{color:var(--good);border-color:rgba(131,189,131,.35);background:rgba(131,189,131,.08)}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{background:transparent;border:none;border-radius:999px;padding:6px 14px;font-size:13px;color:var(--dim);cursor:pointer}
.seg button.on{background:linear-gradient(180deg,#e8d5a8,#c9a96e);color:#1a1409;font-weight:600}
.search{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;outline:none;min-width:150px}
.search::placeholder{color:var(--dim)}

/* buttons & forms */
.btn{
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  padding:9px 14px;font-size:13px;color:var(--gold2);cursor:pointer;transition:.16s;
}
.btn:hover{border-color:rgba(201,169,110,.5);background:#2a2216}
.btn.primary{background:linear-gradient(180deg,#e8d5a8,#c9a96e);color:#1a1409;border-color:#e8d5a8;font-weight:600}
.btn.danger{color:var(--bad);border-color:rgba(217,139,122,.3)}
.btn:active{transform:translateY(1px)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
label.fld{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--dim)}
input[type=date],#impText{
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  padding:9px 12px;font-size:13px;outline:none;color:var(--gold2);
}
#impText{width:100%;min-height:110px;resize:vertical;line-height:1.6;margin:12px 0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.fileBtn{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  padding:9px 14px;font-size:13px;cursor:pointer;color:var(--gold2);
}
.fileBtn input{display:none}
.chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--dim)}
.chk input{accent-color:var(--gold)}

/* empty */
.empty{padding:34px 16px;text-align:center}
.empty p{font-size:15px;margin-bottom:6px}
.empty .hint{margin-bottom:16px}

/* toast */
.toast{
  position:fixed;left:50%;bottom:96px;transform:translate(-50%,16px);
  background:rgba(30,24,16,.96);border:1px solid rgba(201,169,110,.4);
  color:var(--gold2);padding:10px 18px;border-radius:999px;font-size:13px;
  opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:86vw;text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* footer note */
.foot{text-align:center;font-size:11px;color:var(--dim);padding:8px 0 30px}

/* mobile */
@media (max-width:640px){
  main{padding:12px 12px 96px}
  .cards{grid-template-columns:repeat(2,1fr)}
  .card .val{font-size:22px}
  .tabs{
    position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:rgba(16,14,10,.97);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    justify-content:space-around;gap:2px;overflow:visible;
  }
  .tabs button{flex:1;padding:7px 4px;font-size:12.5px;border-radius:10px}
  .tabs button.on{background:transparent;color:var(--gold);box-shadow:none;font-weight:700}
  .tabs button.on::before{content:"";display:block;width:16px;height:2px;border-radius:2px;background:var(--gold);margin:0 auto 4px}
  .top{padding-left:12px;padding-right:12px}
  .brand h1{font-size:15px}
  .sub{display:none}
  .dateSel{max-width:118px;font-size:12px}
  .badge{display:none}
  .top5 .nm{font-size:13px}
}
@media (min-width:641px){
  .cards{grid-template-columns:repeat(4,1fr)}
  .two{grid-template-columns:1.15fr 1fr;gap:14px}
  .two .panel{margin-bottom:14px}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="seal">盟</div>
    <div>
      <h1>同盟战功统计看板</h1>
      <p class="sub">门阀 · 战功 · 助攻 · 活跃</p>
    </div>
  </div>
  <div class="topRight">
    <select id="dateSel" class="dateSel" aria-label="数据日期"></select>
    <span class="badge" id="dataBadge">示例数据</span>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button data-page="dash" class="on">仪表盘</button>
  <button data-page="rank">全盟排行</button>
  <button data-page="clan">门阀排行</button>
  <button data-page="admin">管理中心</button>
</nav>

<main>
  <section class="page on" id="page-dash"></section>
  <section class="page" id="page-rank"></section>
  <section class="page" id="page-clan"></section>
  <section class="page" id="page-admin"></section>
  <p class="foot">数据保存在本机浏览器 · 换设备或清缓存不保留</p>
</main>

<div class="toast" id="toast"></div>

<script>
/* ================= 工具 ================= */
const $ = (s, r = document) => r.querySelector(s);
const fmt = n => Number(n || 0).toLocaleString('zh-CN');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dstr = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const WEEK = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];

/* ================= 数据层 ================= */
const KEY = 'alliance_stats_v1';
let db = { records: [], imports: [], demo: true, seeded: false };
let view = { page: 'dash', date: null, mode: 'today', q: '' };
let S = null;                       // 派生缓存
const bump = () => { S = null; };

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const o = JSON.parse(raw);
      if (o && Array.isArray(o.records)) {
        db = { records: o.records, imports: o.imports || [], demo: !!o.demo, seeded: true };
        return;
      }
    }
  } catch (e) { /* 忽略损坏数据 */ }
  seedDemo(true);
  persist();
}

function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { toast('保存失败：浏览器存储不可用'); }
}

function dates() { return [...new Set(db.records.map(r => r.d))].sort(); }
function rosterOf(d) {
  const m = new Map();
  for (const r of db.records) if (r.d === d) m.set(r.n, r);
  return m;
}
function data() {
  if (!S) {
    const ds = dates();
    S = { ds, maps: new Map(ds.map(d => [d, rosterOf(d)])) };
  }
  return S;
}
function latestRec(name, date) {
  const { ds, maps } = data();
  for (let i = ds.indexOf(date); i >= 0; i--) {
    const r = maps.get(ds[i]).get(name);
    if (r) return r;
  }
  return null;
}

/* 当日增量：本周累计差值；若累计变小视为新一周，取当周值 */
function snapshot(date) {
  const { ds, maps } = data();
  const i = ds.indexOf(date);
  const out = new Map();
  if (i < 0) return { date, members: out, prev: null };
  const prev = i > 0 ? ds[i-1] : null;
  for (const [name, r] of maps.get(date)) {
    const p = prev ? latestRec(name, prev) : null;
    const inc  = p ? (r.w < p.w ? r.w : r.w - p.w) : 0;
    const ainc = p ? (r.a < p.a ? r.a : r.a - p.a) : 0;
    out.set(name, { name, clan: r.c, w: r.w, a: r.a, inc, ainc, base: !!p });
  }
  return { date, members: out, prev };
}

function totalsAll() {
  const { ds, maps } = data();
  const res = new Map();
  let prev = new Map();
  for (const d of ds) {
    const cur = maps.get(d);
    for (const [name, r] of cur) {
      const p = prev.get(name);
      const inc  = p ? (r.w < p.w ? r.w : r.w - p.w) : 0;
      const ainc = p ? (r.a < p.a ? r.a : r.a - p.a) : 0;
      const t = res.get(name) || { name, clan: r.c, k: 0, a: 0 };
      t.k += inc; t.a += ainc; t.clan = r.c;
      res.set(name, t);
    }
    prev = cur;
  }
  return res;
}

/* ================= 示例数据 ================= */
function seedDemo(silent) {
  const clans = ['魏·天策', '蜀·卧龙', '吴·江东', '群·无双'];
  const given = ['曹操','张辽','夏侯惇','郭嘉','许褚','刘备','关羽','张飞','赵云','诸葛亮',
                 '孙权','周瑜','陆逊','甘宁','吕布','貂蝉','袁绍','华雄','张角'];
  const recs = [];
  const wk = {};                     // 成员本周累计
  const today = new Date();
  for (let i = 6; i >= 0; i--) {
    const d = new Date(today); d.setDate(d.getDate() - i);
    const ds = dstr(d);
    const mon = d.getDay() === 1;
    given.forEach((n, k) => {
      const inc = Math.round(180 + Math.random() * 1250);
      if (wk[n] === undefined) wk[n] = mon ? inc : Math.round(2600 + Math.random() * 6200) + inc;
      else wk[n] = mon ? inc : wk[n] + inc;
      recs.push({ d: ds, n, c: clans[Math.floor(k / 5) % 4], w: wk[n], a: Math.round(wk[n] * 0.12) });
    });
  }
  db = { records: recs, imports: [], demo: true, seeded: true };
  if (!silent) { persist(); renderAll(); toast('已载入示例数据'); }
}

/* ================= 导入解析 ================= */
function splitLine(line, delim) {
  const out = []; let cur = ''; let q = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (q) {
      if (c === '"' && line[i+1] === '"') { cur += '"'; i++; }
      else if (c === '"') q = false;
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === delim) { out.push(cur); cur = ''; }
    else cur += c;
  }
  out.push(cur);
  return out.map(s => s.trim());
}
function parseNum(v) {
  if (v == null) return 0;
  let s = String(v).replace(/[,，\s]/g, '');
  let mul = 1;
  if (/亿$/.test(s)) mul = 1e8;
  else if (/万$/.test(s)) mul = 1e4;
  s = s.replace(/[亿万]$/, '');
  const n = parseFloat(s.replace(/[^\d.\-]/g, ''));
  return isNaN(n) ? 0 : Math.round(n * mul);
}
function parseDateStr(v) {
  if (!v) return null;
  const s = String(v).trim();
  let m = s.match(/(\d{4})[-/.年](\d{1,2})[-/.月](\d{1,2})/);
  if (m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})[-/月](\d{1,2})/);
  if (m) { const y = new Date().getFullYear(); return `${y}-${String(m[1]).padStart(2,'0')}-${String(m[2]).padStart(2,'0')}`; }
  m = s.match(/^(\d{4})(\d{2})(\d{2})$/);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  return null;
}
function parseCSV(text) {
  const lines = String(text).replace(/^\uFEFF/, '').split(/\r?\n/).filter(l => l.trim());
  if (!lines.length) return { rows: [], skipped: 0, error: '内容是空的' };
  const delim = lines[0].split('\t').length > lines[0].split(',').length ? '\t' : ',';
  const rows = lines.map(l => splitLine(l, delim));
  let header = null, start = 0;
  if (rows[0].some(c => /成员|姓名|玩家|名字|昵称|name|日期|时间|date|门阀|同盟|势力|战功|击杀/i.test(c))) {
    header = rows[0].map(c => c.trim());
    start = 1;
  }
  const idx = {};
  const find = (...keys) => {
    if (!header) return -1;
    for (let i = 0; i < header.length; i++) if (keys.some(k => header[i].includes(k))) return i;
    return -1;
  };
  if (header) {
    idx.date = find('日期', '时间', 'date');
    idx.name = find('成员', '姓名', '玩家', '名字', '昵称', 'name');
    idx.clan = find('门阀', '同盟', '势力', '帮派', 'clan');
    idx.w    = find('战功', '击杀', '功勋', 'kills');
    idx.a    = find('助攻', 'assist');
  } else {
    idx.name = 0; idx.clan = 1; idx.w = 2; idx.a = 3;
  }
  if (idx.name < 0) return { rows: [], skipped: 0, error: '没找到“成员/姓名”这一列' };
  const out = []; let skipped = 0;
  for (let i = start; i < rows.length; i++) {
    const r = rows[i];
    const name = (r[idx.name] || '').trim();
    if (!name) { skipped++; continue; }
    out.push({
      d: idx.date >= 0 ? parseDateStr(r[idx.date]) : null,
      n: name,
      c: (idx.clan >= 0 ? r[idx.clan] : '').trim() || '未分门阀',
      w: parseNum(idx.w >= 0 ? r[idx.w] : 0),
      a: parseNum(idx.a >= 0 ? r[idx.a] : 0)
    });
  }
  return { rows: out, skipped, error: null };
}

/* ================= 渲染：框架 ================= */
function setPage(p) {
  view.page = p;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.page === p));
  document.querySelectorAll('.page').forEach(el => el.classList.toggle('on', el.id === 'page-' + p));
  renderPage();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function renderAll() {
  const ds = dates();
  if (!view.date || !ds.includes(view.date)) view.date = ds.length ? ds[ds.length-1] : null;
  const sel = $('#dateSel');
  if (ds.length) {
    sel.style.display = '';
    sel.innerHTML = ds.slice().reverse().map(d => `<option value="${d}">${d}</option>`).join('');
    sel.value = view.date;
  } else {
    sel.style.display = 'none';
  }
  const badge = $('#dataBadge');
  badge.style.display = ds.length ? '' : 'none';
  badge.textContent = db.demo ? '示例数据' : `已导入 ${db.records.length} 条`;
  badge.classList.toggle('demo', db.demo);
  renderPage();
}
function renderPage() {
  if (view.page === 'dash') renderDash();
  else if (view.page === 'rank') renderRank();
  else if (view.page === 'clan') renderClan();
  else renderAdmin();
}

/* ================= 渲染：仪表盘 ================= */
function renderDash() {
  const el = $('#page-dash');
  const ds = dates();
  if (!ds.length) {
    el.innerHTML = `<div class="panel empty"><p>还没有数据</p>
      <p class="hint">导入每天的战功表格，就能看到排行、趋势和人员变动。</p>
      <button class="btn primary" data-act="goAdmin">去管理中心</button></div>`;
    return;
  }
  const snap = snapshot(view.date);
  const prevSnap = snap.prev ? snapshot(snap.prev) : null;
  let k = 0, a = 0, active = 0;
  const clans = new Set(), byClan = new Map();
  for (const m of snap.members.values()) {
    k += m.inc; a += m.ainc;
    if (m.inc > 0) active++;
    clans.add(m.clan);
    const c = byClan.get(m.clan) || { name: m.clan, k: 0, a: 0, n: 0 };
    c.k += m.inc; c.a += m.ainc; c.n++; byClan.set(m.clan, c);
  }
  let pk = 0;
  if (prevSnap) for (const m of prevSnap.members.values()) pk += m.inc;
  const delta = prevSnap ? k - pk : 0;
  const deltaTxt = !prevSnap ? '无昨日基线' : (delta >= 0 ? `较昨日 +${fmt(delta)}` : `较昨日 ${fmt(delta)}`);
  const last7 = ds.slice(-7);
  const trend = last7.map(d => [...snapshot(d).members.values()].reduce((s, m) => s + m.inc, 0));
  const top = [...snap.members.values()].sort((x, y) => y.inc - x.inc).slice(0, 5);
  const bars = [...byClan.values()].sort((x, y) => y.k - x.k);
  const maxBar = Math.max(...bars.map(b => b.k), 1);

  const changes = (() => {
    if (!snap.prev) return { joined: [], left: [] };
    const now = new Set(snap.members.keys());
    const before = new Set(snapshot(snap.prev).members.keys());
    return {
      joined: [...now].filter(n => !before.has(n)),
      left: [...before].filter(n => !now.has(n))
    };
  })();

  el.innerHTML = `
    <div class="cards">
      <div class="card"><div class="lbl">今日战功</div><div class="val">${fmt(k)}</div>
        <div class="cap ${delta >= 0 ? 'up' : 'down'}">${deltaTxt}</div></div>
      <div class="card"><div class="lbl">今日助攻</div><div class="val">${fmt(a)}</div>
        <div class="cap">${snap.members.size} 名成员</div></div>
      <div class="card"><div class="lbl">活跃成员</div><div class="val">${active}</div>
        <div class="cap">有战功增量</div></div>
      <div class="card"><div class="lbl">门阀总数</div><div class="val">${clans.size}</div>
        <div class="cap">${view.date} ${WEEK[new Date(view.date + 'T00:00:00').getDay()]}</div></div>
    </div>

    <div class="panel">
      <div class="panelHead"><h2>近 7 日战功趋势</h2><span class="hint">当日增量</span></div>
      ${lineChart(trend, last7)}
    </div>

    <div class="two">
      <div class="panel">
        <div class="panelHead"><h2>门阀战功分布</h2><span class="hint">${view.date}</span></div>
        <div class="bars">${bars.map(b => `
          <div class="barRow"><div class="nm" title="${esc(b.name)}">${esc(b.name)}</div>
            <div class="barTrack"><div class="barFill" style="width:${Math.max(2, b.k / maxBar * 100)}%"></div></div>
            <div class="vv">${fmt(b.k)}</div></div>`).join('') || '<p class="hint">暂无门阀数据</p>'}
        </div>
      </div>
      <div class="panel">
        <div class="panelHead"><h2>今日 TOP 5</h2><span class="hint">战功增量</span></div>
        <ol class="top5">${top.map((m, i) => `
          <li><span class="rk">${i + 1}</span>
            <span class="nm">${esc(m.name)}<small>${esc(m.clan)}</small></span>
            <span class="vv">+${fmt(m.inc)}</span></li>`).join('') || '<p class="hint">暂无数据</p>'}
        </ol>
      </div>
    </div>

    <div class="panel">
      <div class="panelHead"><h2>人员变动</h2><span class="hint">${snap.prev ? `对比 ${snap.prev}` : '没有前一天数据'}</span></div>
      <div class="row" style="gap:22px;align-items:flex-start">
        <div><p class="hint" style="margin-bottom:6px">新进 ${changes.joined.length}</p>
          <div class="row" style="gap:6px">${changes.joined.map(n => `<span class="tag on">${esc(n)}</span>`).join('') || '<span class="muted" style="font-size:12px">无</span>'}</div></div>
        <div><p class="hint" style="margin-bottom:6px">离开 ${changes.left.length}</p>
          <div class="row" style="gap:6px">${changes.left.map(n => `<span class="tag">${esc(n)}</span>`).join('') || '<span class="muted" style="font-size:12px">无</span>'}</div></div>
      </div>
    </div>`;
}

/* ================= 渲染：排行 ================= */
function rankRows() {
  const snap = snapshot(view.date);
  const tot = view.mode === 'total' ? totalsAll() : null;
  const rows = [];
  for (const m of snap.members.values()) {
    let k = m.inc, a = m.ainc, w = m.w;
    if (view.mode === 'week') { k = m.w; a = m.a; }
    if (view.mode === 'total') { const t = tot.get(m.name) || { k: 0, a: 0 }; k = t.k; a = t.a; }
    rows.push({ name: m.name, clan: m.clan, k, a, w, active: m.inc > 0 });
  }
  return rows.sort((x, y) => y.k - x.k || y.a - x.a);
}
function renderRank() {
  const el = $('#page-rank');
  if (!dates().length) { el.innerHTML = emptyPanel(); return; }
  const rows = rankRows();
  const maxK = Math.max(...rows.map(r => r.k), 1);
  el.innerHTML = `
    <div class="toolbar">
      <div class="seg" id="rankMode">
        <button data-mode="today" class="${view.mode === 'today' ? 'on' : ''}">今日</button>
        <button data-mode="week" class="${view.mode === 'week' ? 'on' : ''}">本周</button>
        <button data-mode="total" class="${view.mode === 'total' ? 'on' : ''}">累计</button>
      </div>
      <input class="search" id="q" placeholder="搜索成员 / 门阀" value="${esc(view.q)}">
    </div>
    <div class="panel tableWrap">
      <table>
        <thead><tr><th style="width:38px">#</th><th class="l">成员</th><th class="l">门阀</th>
          <th>${view.mode === 'today' ? '今日战功' : view.mode === 'week' ? '本周战功' : '累计战功'}</th>
          <th>助攻</th><th class="l" style="width:96px">占比</th></tr></thead>
        <tbody id="rankBody">${rows.length ? rows.map((r, i) => {
          const show = !view.q || (r.name + r.clan).toLowerCase().includes(view.q.toLowerCase());
          return `<tr data-name="${esc(r.name + ' ' + r.clan)}" ${show ? '' : 'hidden'}>
            <td class="muted">${i + 1}</td>
            <td class="l">${esc(r.name)} ${r.active ? '<span class="tag on">活跃</span>' : ''}</td>
            <td class="l muted">${esc(r.clan)}</td>
            <td>${fmt(r.k)}</td><td class="muted">${fmt(r.a)}</td>
            <td class="l"><div class="barTrack" style="height:6px"><div class="barFill" style="width:${Math.max(1, r.k / maxK * 100)}%"></div></div></td>
          </tr>`;
        }).join('') : '<tr><td colspan="6" class="muted" style="text-align:center;padding:22px">暂无数据</td></tr>'}
        </tbody>
      </table>
    </div>
    <p class="hint">${view.mode === 'week' ? '本周战功取当日累计值；本周一会被识别为新一周。' : view.mode === 'total' ? '累计 = 每日增量之和，首次出现的成员没有基线，按 0 计。' : '今日战功 = 今日累计 − 昨日本周累计；累计回落视为新一周。'}</p>`;
}
function emptyPanel() {
  return `<div class="panel empty"><p>还没有数据</p>
    <p class="hint">先在管理中心导入 CSV 或载入示例数据。</p>
    <button class="btn primary" data-act="goAdmin">去管理中心</button></div>`;
}

/* ================= 渲染：门阀 ================= */
function renderClan() {
  const el = $('#page-clan');
  if (!dates().length) { el.innerHTML = emptyPanel(); return; }
  const snap = snapshot(view.date);
  const map = new Map();
  for (const m of snap.members.values()) {
    const c = map.get(m.clan) || { name: m.clan, n: 0, k: 0, a: 0, active: 0 };
    c.n++; c.k += m.inc; c.a += m.ainc; if (m.inc > 0) c.active++;
    map.set(m.clan, c);
  }
  const rows = [...map.values()].sort((x, y) => y.k - x.k);
  const total = rows.reduce((s, r) => s + r.k, 0) || 1;
  const maxK = Math.max(...rows.map(r => r.k), 1);
  el.innerHTML = `
    <div class="panel">
      <div class="panelHead"><h2>门阀战功排行</h2><span class="hint">${view.date}</span></div>
      <div class="bars">${rows.map(r => `
        <div class="barRow"><div class="nm" title="${esc(r.name)}">${esc(r.name)}</div>
          <div class="barTrack"><div class="barFill" style="width:${Math.max(2, r.k / maxK * 100)}%"></div></div>
          <div class="vv">${fmt(r.k)}</div></div>`).join('')}
      </div>
    </div>
    <div class="panel tableWrap">
      <table>
        <thead><tr><th class="l">门阀</th><th>人数</th><th>今日战功</th><th>助攻</th><th>人均</th><th>占比</th></tr></thead>
        <tbody>${rows.map(r => `<tr>
          <td class="l">${esc(r.name)}</td><td>${r.n}</td><td>${fmt(r.k)}</td>
          <td class="muted">${fmt(r.a)}</td><td class="muted">${fmt(Math.round(r.k / r.n))}</td>
          <td class="muted">${(r.k / total * 100).toFixed(1)}%</td></tr>`).join('')}
        </tbody>
      </table>
    </div>`;
}

/* ================= 渲染：管理 ================= */
function renderAdmin() {
  const el = $('#page-admin');
  const today = dstr(new Date());
  const ds = dates();
  el.innerHTML = `
    <div class="panel">
      <div class="panelHead"><h2>导入数据</h2><span class="hint">CSV / TSV / 表格粘贴</span></div>
      <p class="hint">列名包含「日期、成员、门阀、战功、助攻」会自动识别；没有日期列时用下面选的日期。</p>
      <div class="row" style="margin-top:12px">
        <label class="fld">数据日期<input type="date" id="impDate" value="${view.date || today}"></label>
        <label class="fileBtn">选择文件<input type="file" id="impFile" accept=".csv,.tsv,.txt"></label>
        <button class="btn" data-act="template">下载模板</button>
      </div>
      <textarea id="impText" placeholder="日期,成员,门阀,战功,助攻&#10;2026-11-27,曹操,魏·天策,18234,2100&#10;2026-11-27,关羽,蜀·卧龙,16520,1980"></textarea>
      <div class="row end">
        <label class="chk"><input type="checkbox" id="impOver" checked> 覆盖同日期数据</label>
        <button class="btn primary" data-act="import">导入</button>
      </div>
      <p class="hint" id="impHint" style="margin-top:10px"></p>
    </div>

    <div class="panel">
      <div class="panelHead"><h2>导入记录</h2><span class="hint">${db.imports.length} 次</span></div>
      ${db.imports.length ? `<div class="tableWrap"><table><thead><tr><th class="l">日期</th><th>条数</th><th class="l">时间</th></tr></thead>
        <tbody>${db.imports.slice(0, 12).map(i => `<tr><td class="l">${esc(i.date)}</td><td>${i.count}</td>
          <td class="l muted">${new Date(i.at).toLocaleString('zh-CN')}</td></tr>`).join('')}</tbody></table></div>`
        : '<p class="hint">还没有导入记录。</p>'}
    </div>

    <div class="panel">
      <div class="panelHead"><h2>数据管理</h2><span class="hint">${db.records.length} 条 · ${ds.length} 天</span></div>
      <div class="row">
        <button class="btn" data-act="exportCsv">导出 CSV</button>
        <button class="btn" data-act="exportJson">导出备份</button>
        <label class="fileBtn">恢复备份<input type="file" id="impJson" accept=".json"></label>
        <button class="btn" data-act="seed">载入示例</button>
        <button class="btn danger" data-act="clear">清空全部</button>
      </div>
      <p class="hint" style="margin-top:12px">数据只存在你这台设备的浏览器里（localStorage）。发给别人看是各自独立的一份，不会同步。</p>
    </div>`;

  const file = $('#impFile');
  file.addEventListener('change', () => {
    const f = file.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => { $('#impText').value = String(r.result); toast('已读取 ' + f.name); };
    r.readAsText(f, 'utf-8');
  });
  const json = $('#impJson');
  json.addEventListener('change', () => {
    const f = json.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const o = JSON.parse(String(r.result));
        if (!o || !Array.isArray(o.records)) throw new Error('格式不对');
        db = { records: o.records, imports: o.imports || [], demo: false, seeded: true };
        persist(); bump(); renderAll(); toast('已恢复 ' + o.records.length + ' 条');
      } catch (e) { toast('恢复失败：' + e.message); }
    };
    r.readAsText(f, 'utf-8');
  });
}

/* ================= 图表 ================= */
function lineChart(points, labels) {
  if (!points.length) return '<p class="hint">暂无数据</p>';
  const W = 600, H = 190, L = 48, R = 14, T = 16, B = 28;
  const maxV = Math.max(...points, 1) * 1.15;
  const X = i => L + (W - L - R) * (i / Math.max(points.length - 1, 1));
  const Y = v => H - B - (v / maxV) * (H - T - B);
  const pts = points.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`);
  const area = `M${X(0).toFixed(1)},${H - B} L` + pts.join(' L') + ` L${X(points.length - 1).toFixed(1)},${H - B} Z`;
  const grid = [0, 0.5, 1].map(r => {
    const y = (H - B - r * (H - T - B)).toFixed(1);
    const val = Math.round(maxV * r);
    return `<line class="grid" x1="${L}" y1="${y}" x2="${W - R}" y2="${y}"></line>
      <text x="${L - 8}" y="${Number(y) + 4}" text-anchor="end">${val >= 10000 ? (val / 10000).toFixed(1) + '万' : fmt(val)}</text>`;
  }).join('');
  const xlabels = labels.map((t, i) => i % 2 === 0 || i === labels.length - 1
    ? `<text x="${X(i).toFixed(1)}" y="${H - 8}" text-anchor="middle">${t.slice(5)}</text>` : '').join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="战功趋势">
    <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9a96e" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#c9a96e" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}
    <path d="${area}" fill="url(#g1)"></path>
    <polyline class="line" points="${pts.join(' ')}"></polyline>
    ${points.map((v, i) => `<circle class="dot" cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="2.6"></circle>`).join('')}
    ${xlabels}
  </svg>`;
}

/* ================= 交互 ================= */
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('on'), 2400);
}
function download(name, content, type) {
  const blob = new Blob([content], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 300);
}
function doImport() {
  const text = $('#impText').value.trim();
  if (!text) { toast('先粘贴内容或选择文件'); return; }
  const date = $('#impDate').value || dstr(new Date());
  const overwrite = $('#impOver').checked;
  const { rows, skipped, error } = parseCSV(text);
  if (error) { toast('解析失败：' + error); return; }
  if (!rows.length) { toast('没有解析到有效行'); return; }
  const recs = rows.map(r => ({ d: r.d || date, n: r.n, c: r.c, w: r.w, a: r.a }));
  const touched = new Set(recs.map(r => r.d));
  if (db.demo) { db.records = []; db.imports = []; }   // 首次导入真实数据时清掉示例
  if (overwrite) db.records = db.records.filter(r => !touched.has(r.d));
  db.records = db.records.concat(recs);
  db.imports.unshift({ date: [...touched].sort().join(' ~ '), count: recs.length, at: new Date().toISOString() });
  db.imports = db.imports.slice(0, 60);
  db.demo = false;
  persist(); bump();
  $('#impText').value = '';
  view.date = [...touched].sort().pop();
  renderAll();
  $('#impHint').textContent = `已导入 ${recs.length} 条${skipped ? `，跳过 ${skipped} 条（缺成员名）` : ''}。`;
  toast(`导入成功：${recs.length} 条`);
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-page]');
  if (b) { setPage(b.dataset.page); return; }
  const m = e.target.closest('#rankMode button');
  if (m) { view.mode = m.dataset.mode; renderRank(); return; }
  const act = e.target.closest('[data-act]');
  if (!act) return;
  const a = act.dataset.act;
  if (a === 'goAdmin') setPage('admin');
  else if (a === 'import') doImport();
  else if (a === 'clear') {
    if (!confirm('清空全部数据？包括导入记录，操作不可撤销。')) return;
    db = { records: [], imports: [], demo: false, seeded: true };
    persist(); bump(); view.date = null; renderAll(); toast('已清空');
  } else if (a === 'seed') {
    if (db.records.length && !confirm('这会替换当前所有数据，继续？')) return;
    seedDemo(false); view.date = null; renderAll();
  } else if (a === 'exportCsv') {
    const head = '日期,成员,门阀,周战功,周助攻\n';
    const body = db.records.slice().sort((x, y) => x.d.localeCompare(y.d) || x.n.localeCompare(y.n))
      .map(r => [r.d, r.n, r.c, r.w, r.a].join(',')).join('\n');
    download('同盟战功数据.csv', head + body, 'text/csv;charset=utf-8');
  } else if (a === 'exportJson') {
    download('同盟战功备份-' + dstr(new Date()) + '.json', JSON.stringify(db, null, 2), 'application/json');
  } else if (a === 'template') {
    const t = '日期,成员,门阀,战功,助攻\n' + dstr(new Date()) + ',曹操,魏·天策,18234,2100\n' + dstr(new Date()) + ',关羽,蜀·卧龙,16520,1980\n';
    download('导入模板.csv', t, 'text/csv;charset=utf-8');
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'q') {
    view.q = e.target.value;
    const q = view.q.toLowerCase();
    document.querySelectorAll('#rankBody tr[data-name]').forEach(tr => {
      tr.hidden = q && !tr.dataset.name.toLowerCase().includes(q);
    });
  }
});

$('#dateSel').addEventListener('change', e => { view.date = e.target.value; renderAll(); });

/* ================= 启动 ================= */
load();
renderAll();
</script>
</body>
